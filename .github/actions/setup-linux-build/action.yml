# Prepares a bare old-glibc container to build the dig-node Linux artifacts, and DECLARES the
# canonical glibc floor those artifacts must honour.
#
# WHY (#1736): a glibc-linked binary runs on its BUILD glibc and anything newer, never anything
# older — so the builder image, and nothing else, sets the supported-OS floor. dig-node v0.64.0
# silently began requiring glibc >= 2.38 (breaking Ubuntu 22.04 LTS, Debian 12 and Amazon Linux
# 2023) purely because GitHub repointed `ubuntu-latest` at Ubuntu 24.04. Every job that produces a
# shipped Linux artifact — the release binaries AND the apt `.deb` — therefore runs inside a PINNED
# container and calls this action, so there is one floor rather than one per workflow.
#
# The job must declare `container: debian:11`; this action asserts that the container it is running
# in really provides `glibc-floor`, so the image and the number cannot drift apart.
#
# Because this is a LOCAL composite action it can only run after `actions/checkout`, and checkout in
# a bare container needs `git` + `curl` + CA certificates already present — so each calling job
# bootstraps exactly those three packages first, then checks out, then calls this action.
name: Set up an old-glibc Linux build
description: Install the Rust + C toolchains in the pinned old-glibc container and assert its glibc matches the canonical floor.

outputs:
  glibc-floor:
    description: "The canonical minimum glibc version every published dig-node Linux artifact must run on."
    value: ${{ steps.floor.outputs.version }}

runs:
  using: composite
  steps:
    - name: Declare the canonical glibc floor
      id: floor
      shell: bash
      # THE single source of truth for the floor. 2.31 (Debian 11) clears every distro #1736
      # reported broken — Ubuntu 22.04 (2.35), Debian 12 (2.36), Amazon Linux 2023 (2.34) — plus
      # Ubuntu 20.04 (2.31), Debian 11 (2.31) and RHEL 9 (2.34). Raising it is a DELIBERATE act:
      # change this value, the `container:` image in every calling job, SPEC.md §11.3 and the
      # published docs together — never one alone.
      run: echo "version=2.31" >>"$GITHUB_OUTPUT"

    - name: Install the Rust + C toolchains
      shell: bash
      # The container is a bare Debian 11 with neither toolchain. The C toolchain is not optional:
      # `openssl-sys` builds vendored OpenSSL from source (needs perl + make) and several other
      # -sys crates in the Chia-wallet-SDK graph want cmake/clang. `binutils` provides the
      # `readelf` the floor gate reads.
      #
      # TWO REAL, DIFFERENT CAUSES — verified directly, not guessed (do not re-litigate without
      # new evidence; three earlier hypotheses were wrong before these two were confirmed).
      #
      # CAUSE 1 (permanent, deterministic, per-host): deb.debian.org's `debian-security` POOL is
      # missing objects that the canonical `security.debian.org` always has. Measured repeatedly,
      # not once:
      #   libperl5.32 u5   security.debian.org : 6/6  -> 200
      #   libperl5.32 u5   deb.debian.org      : 0/6  -> 404, every time
      # Same path, same filename, different host. The index was NEVER stale on deb.debian.org
      # either (Last-Modified: Mon, 31 Aug 2026 19:41:45 GMT, Age: 67, X-Cache: HIT, correctly
      # naming Version: 5.32.1-4+deb11u5) — a correctly-current index named a file its own host's
      # pool does not have, at u5, u6 AND u7 alike. No amount of retrying or index-refreshing
      # fixes an object one host never carries. FIX: the `sed` below, pointing `debian-security`
      # at `security.debian.org` before any apt-get call — verified locally end-to-end
      # (`docker run debian:11`): without it, install 404s on libperl5.32 every time; with it,
      # every package installs and configures cleanly.
      #
      # CAUSE 2 (transient, per-edge, on the CORRECT host): security.debian.org itself can still
      # 404 on an object that demonstrably exists, because a specific Fastly POP is serving a
      # stale or negative cache entry for it — NOT because the pool pruned anything (`libexpat1`
      # u8 does not exist; u7 is current and present). Measured: `libexpat1` u7 from
      # security.debian.org is 20/20 -> 200 from one vantage, while CI 404'd the identical URL
      # from POP IP 151.101.130.132 at a single point in time. FIX: `-o
      # Acquire::http::No-Cache=true` on the install below forces revalidation so a retry cannot
      # be re-served the same cached response — `rm -rf /var/lib/apt/lists/*` already forces a
      # fresh INDEX; this forces fresh PACKAGE fetches, which is the layer that was actually
      # failing here. The backoff is lengthened (attempt*10, up to 40s between tries) because an
      # edge cache needs real wall-clock time to invalidate, and the previous, shorter backoff
      # completed its whole 5-attempt run in about 25 seconds — not long enough to matter.
      #
      # Neither cause is "the pool prunes superseded files as point releases land" — that framing
      # (an earlier, wrong hypothesis in this file's history) does not match either measurement
      # above and should not be reintroduced without new evidence.
      #
      # SEPARATE, TRACKED ELSEWHERE, NOT ADDRESSED HERE: bullseye-security's Release file states
      # `Valid-Until: Mon, 07 Sep 2026 21:13:04 UTC` — bullseye is oldoldstable, and once that
      # date passes apt will reject the index outright ("Release file expired") regardless of host
      # or cache state. Tracked as dig-node#565 (bullseye EOL / base-image decision). Do NOT
      # silence it with `Acquire::Check-Valid-Until "false"` and do NOT change the base image
      # here — that call is the coordinator's, not a side effect of this fix.
      run: |
        set -eux
        sed -i 's#http://deb.debian.org/debian-security#http://security.debian.org/debian-security#' /etc/apt/sources.list
        for attempt in 1 2 3 4 5; do
          if apt-get update -qq && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::No-Cache=true \
            ca-certificates curl git build-essential pkg-config perl make cmake clang binutils; then
            exit 0
          fi
          echo "apt bootstrap attempt $attempt/5 failed -- resetting apt/dpkg state and retrying" >&2
          dpkg --configure -a || true
          apt-get -f install -y || true
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          sleep $(( attempt * 10 ))
        done
        echo "::error::apt bootstrap failed after 5 attempts" >&2
        exit 1

    - name: Verify the container glibc IS the declared floor
      shell: bash
      run: |
        set -eu
        # NO PIPE. `ldd --version | head -n1` is a SIGPIPE race: `head` closes the pipe after the
        # first line, `ldd` dies with SIGPIPE, and under `pipefail` the step fails with exit 141
        # — intermittently, depending on whether ldd had already finished writing. It passed twice
        # before failing once. Read the output into a variable and slice it with shell expansion.
        ldd_output="$(ldd --version 2>&1)"
        IFS= read -r first_line <<<"$ldd_output"
        # glibc's banner ends with the bare version, e.g. "ldd (Debian GLIBC 2.31-13) 2.31".
        actual="${first_line##* }"
        declared="${{ steps.floor.outputs.version }}"
        case "$actual" in
          [0-9]*.[0-9]*) ;;
          *)
            echo "::error::could not parse a glibc version out of: $first_line"
            exit 1
            ;;
        esac
        echo "container glibc: $actual, declared floor: $declared"
        test "$actual" = "$declared" || {
          echo "::error::build container glibc $actual != the declared floor $declared. Update the floor in .github/actions/setup-linux-build/action.yml, every calling job's container: image, SPEC.md §11.3 and the docs TOGETHER."
          exit 1
        }

    - name: Install Rust via rustup
      shell: bash
      # rustup, not Debian 11's rustc, which is far older than this workspace needs. Only the Rust
      # toolchain comes from rustup — the glibc it links against is the container's, which is the
      # entire point of the container.
      run: |
        set -eu
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
