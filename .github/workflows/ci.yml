# PR quality gates for the dig-node Rust workspace: formatting, linting, tests, and
# a (measure-only) coverage report. Runs on every PR to main (and on pushes to main
# so the default branch history stays green). Job `name:`s are stable — they are the
# required-check contexts wired on the protected branch.
#
# Build note: this workspace depends on digstore's store-format crates, whose build
# script embeds the digstore guest wasm (BINDING contract D6). The wasm is VENDORED in
# this repo (vendor/digstore_guest.wasm) and pointed at by .cargo/config.toml via the
# DIGSTORE_GUEST_WASM override, so no wasm build step is needed here — the checkout
# already carries the artifact. See CLAUDE.md §3.5.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The release path's CI-consumed shell scripts have their own tests, and they gate a real
  # shipping property (#1736: the glibc floor of every published Linux artifact), so they run on
  # every PR rather than only when a release is being built — a broken floor gate discovered at
  # release time is discovered too late.
  scripts:
    name: Release-script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A workflow whose piped step discards the real command's exit code makes a REQUIRED check
      # unable to fail (dig_ecosystem#2513). Gate the workflows themselves, not just the code.
      - name: Workflow pipefail gate
        shell: bash
        run: ./scripts/check-workflow-pipefail.sh

      - name: scripts/tests
        run: |
          set -eu
          for t in scripts/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # cargo-nextest drives the whole workspace test suite, WITH `--retries 2` so a flaky
      # test gets a second chance before failing the job (#489) instead of blocking a
      # release on a false negative; nextest surfaces a retried-but-passed test distinctly
      # (flaky, not a silent pass) in its run summary. `cargo llvm-cov nextest` runs nextest
      # itself through the SAME instrumented build so coverage is still collected —
      # running nextest and llvm-cov as two separate steps collects NO coverage at all, so
      # this must stay one combined invocation.
      #
      # `--fail-under-lines 80` ENFORCES the CLAUDE.md §2.3 floor: a run below 80% line
      # coverage across the whole workspace exits non-zero and fails this required check.
      # It was previously carried here as prose, which made the job report a real number
      # and act on none of it — a gate that cannot fail reads as enforcement to every
      # reviewer downstream (dig_ecosystem#3033). Measured 87.67% lines / 82.00% functions
      # / 86.46% regions at the time it was turned on, so the floor is the contract's 80
      # rather than a number tuned to whatever passes today, and needs no exclusions.
      - name: cargo llvm-cov nextest (test + coverage, flaky-retried, ≥80% gated)
        run: |
          # pipefail is load-bearing, not boilerplate: the Actions default `run:` shell is
          # `bash -e {0}` WITHOUT it, so this step's status would be `tee`'s. A run that died
          # with `exit status: 102` reported this REQUIRED check green in 29s.
          set -euo pipefail
          cargo llvm-cov nextest --workspace --locked --retries 2 --fail-under-lines 80 --summary-only | tee coverage-summary.txt

      - name: Coverage summary to job summary
        if: always()
        run: |
          {
            echo '### dig-node coverage (gated at ≥80% lines)'
            echo '```'
            cat coverage-summary.txt 2>/dev/null || echo 'no coverage output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
