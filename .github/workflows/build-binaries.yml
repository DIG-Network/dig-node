# The ONE place dig-node's cross-OS binary build lives. It is a REUSABLE workflow
# (`on: workflow_call` only — it never fires on its own): both release paths call it, so the
# OS/arch matrix + toolchain setup are defined exactly once (DRY, CLAUDE.md §2.5):
#
#   * release.yml          — the STABLE `vX.Y.Z` tag builder, and
#   * nightly-release.yml   — the NIGHTLY pre-release channel.
#
# The caller passes the version string stamped into each artifact's filename and, optionally, the
# git ref to build. The job builds the self-contained `dig-node` service binary AND its first-class
# `dign` alias (issue #548) for every supported OS/arch, and uploads them as run artifacts the
# caller's publish job attaches to a GitHub Release.
#
# ASSET NAMING (SPEC §11.2) — every per-OS/arch binary is published under the CANONICAL name:
#   * `dig-node-<ver>-<os>-<arch>[.exe]` ← the name every downstream consumer resolves: the
#       dig-installer thin-shim (its dig-node Repo stem is `dig-node`) and apt.dig.net's packaging
#       (whose Linux template is `dig-node-{ver}-linux-{arch}`).
# The duplicate legacy `dig-companion-*` copy is NO LONGER published (#585). dig-node was formerly
# dig-companion (#209); nothing resolves the legacy name from a dig-node RELEASE — the installer's
# pre-rename fallback targets the SEPARATE `DIG-Network/dig-companion` repo's own frozen historical
# releases, not this asset name — so the duplicate was pure release-noise.
# `dign` is a FIRST-CLASS alias binary (issue #548): a SEPARATE `[[bin]]` target sharing the SAME
# entrypoint, published alongside `dig-node` under its own stem `dign-<ver>-<os>-<arch>[.exe]`.
#
# THE LINUX TARGETS BUILD INSIDE A PINNED OLD-GLIBC CONTAINER (`debian:11`, glibc 2.31), in their
# own `build-linux` job — NOT on the runner image (#1736). A glibc-linked binary runs on the build
# glibc and anything NEWER, never anything older, so the builder image silently dictates the
# supported-OS floor. When GitHub moved `ubuntu-latest` to Ubuntu 24.04 the v0.64.0 `linux-x64`
# binary began requiring glibc >= 2.38 and stopped starting on Ubuntu 22.04 LTS (2.35), Debian 12
# (2.36) and Amazon Linux 2023 (2.34) — the three most common server distros — with no code change
# and no signal. Pinning the container makes the floor an explicit, reviewable decision, and
# `scripts/check-glibc-floor.sh` FAILS the build if a produced binary exceeds it (#1741 covers the
# arch half of the same problem).
#
# `linux-arm64` IS published (#1741): it builds NATIVELY on the free public-repo `ubuntu-24.04-arm`
# runner, so the vendored `openssl-sys` in the Chia-wallet-SDK graph is compiled by a native
# toolchain. The old SPEC §11.3 rationale for omitting arm64 was about CROSS-compiling OpenSSL;
# a native arm64 runner removes that objection entirely. Graviton/Ampere/Pi hosts are exactly the
# always-on machines a volunteer node runs on.
#
# The gate runs fmt + clippy ONLY — a PR's own CI (ci.yml) already ran the full
# fmt/clippy/test/coverage set (`cargo llvm-cov nextest --workspace`) against the merged tree
# before merge (§2.4a). Re-running `cargo test` on the release path added nothing but a second
# chance for a flaky test to block a release that already passed its gate once (#488/#489); fmt +
# clippy stay because they are deterministic and a cheap fail-fast before spending build minutes.
name: Build binaries (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string stamped into each artifact filename (e.g. `1.2.3` or `1.2.3-nightly.20260714.abc1234`)."
        type: string
        required: true
      ref:
        description: "Git ref (tag / branch / SHA) to check out and build. Empty = the caller run's commit."
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # ENOSPC guard: the workspace compiles the full P2P stack (dig-nat/gossip/dht/pex/download) +
  # wasmtime/cranelift + the chia wallet SDK, whose debug symbols blow the runner disk. Strip
  # debuginfo from dev + test + release builds so a full build/clippy fits the CI disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # Gate: fmt + clippy on Linux, once. A ref that doesn't pass the gate never produces release
  # binaries. No test re-run here — see the header comment (#489).
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust (stable + components)
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-companion-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-companion-check-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Windows + macOS build on their HOST runner images. Neither has a glibc floor to defend: the
  # Windows binary targets the MSVC CRT and macOS pins its floor via the SDK/deployment target, so
  # only the Linux targets need the pinned-container treatment (`build-linux` below).
  build:
    name: build (${{ matrix.out_name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"
            out_name: windows-x64.exe
          # Both macOS arches build on the fast Apple-silicon macos-14 runner; the Intel binary is
          # CROSS-COMPILED there (host arm64 → target x86_64-apple-darwin). The only C/asm dep in
          # the macOS graph is `ring` (via rustls); `openssl-sys` is cfg-gated to non-Apple targets,
          # so there is no vendored-openssl cross-compile to worry about.
          - os: macos-14 # Apple silicon (arm64)
            target: aarch64-apple-darwin
            out_name: macos-arm64
          - os: macos-14 # Apple silicon — cross-compiles the Intel binary
            target: x86_64-apple-darwin
            out_name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust + target
        shell: bash
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-companion-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-companion-build-${{ matrix.target }}-
      - name: Build release binaries (dig-node + dign alias)
        # Build BOTH bins — `dign` is the first-class alias (issue #548), published alongside
        # `dig-node` under its own asset stem below.
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dig-node --bin dign
      # The caller's `version` is stamped into the filename verbatim: a plain `1.2.3` for a stable
      # tag, or the synthesized `1.2.3-nightly.YYYYMMDD.<shortsha>` for a nightly. Naming lives in
      # the composite action so this job and `build-linux` can never diverge on it.
      - uses: ./.github/actions/stage-binaries
        with:
          version: ${{ inputs.version }}
          target: ${{ matrix.target }}
          out-name: ${{ matrix.out_name }}
          exe-suffix: ${{ matrix.exe_suffix }}

  # The LINUX targets, built NATIVELY inside a pinned old-glibc container so the supported-OS floor
  # is a decision rather than a side effect of whatever image `ubuntu-latest` points at this month
  # (#1736 — see the header). aarch64 builds on the free public-repo arm64 runner (#1741), which
  # means the vendored `openssl-sys` in the Chia-wallet-SDK graph is never cross-compiled.
  build-linux:
    name: build (${{ matrix.out_name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            out_name: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            out_name: linux-arm64
    runs-on: ${{ matrix.runner }}
    # Debian 11 = glibc 2.31 = the floor declared by `.github/actions/setup-linux-build`, which
    # asserts the two agree — so bumping this image without bumping the floor fails the build
    # instead of silently shipping a higher floor.
    container: debian:11
    steps:
      # Bootstrap only what `actions/checkout` itself needs in a bare container; the full toolchain
      # (and the floor assertion) comes from the local composite action, which cannot run until the
      # repository is on disk.
      - name: Bootstrap the container for checkout
        # TWO REAL, DIFFERENT CAUSES — verified directly, not guessed (do not re-litigate without
        # new evidence; three earlier hypotheses were wrong before these two were confirmed).
        #
        # CAUSE 1 (permanent, deterministic, per-host): deb.debian.org's `debian-security` POOL is
        # missing objects that the canonical `security.debian.org` always has. Measured repeatedly,
        # not once:
        #   libperl5.32 u5   security.debian.org : 6/6  -> 200
        #   libperl5.32 u5   deb.debian.org      : 0/6  -> 404, every time
        # Same path, same filename, different host. The index was NEVER stale on deb.debian.org
        # either (Last-Modified: Mon, 31 Aug 2026 19:41:45 GMT, Age: 67, X-Cache: HIT, correctly
        # naming Version: 5.32.1-4+deb11u5) — a correctly-current index named a file its own host's
        # pool does not have, at u5, u6 AND u7 alike. No amount of retrying or index-refreshing
        # fixes an object one host never carries. FIX: the `sed` below, pointing `debian-security`
        # at `security.debian.org` before any apt-get call — verified locally end-to-end
        # (`docker run debian:11`): without it, install 404s on libperl5.32 every time; with it,
        # every package installs and configures cleanly.
        #
        # CAUSE 2 (transient, per-edge, on the CORRECT host): security.debian.org itself can still
        # 404 on an object that demonstrably exists, because a specific Fastly POP is serving a
        # stale or negative cache entry for it — NOT because the pool pruned anything (`libexpat1`
        # u8 does not exist; u7 is current and present). Measured: `libexpat1` u7 from
        # security.debian.org is 20/20 -> 200 from one vantage, while CI 404'd the identical URL
        # from POP IP 151.101.130.132 at a single point in time. FIX: `-o
        # Acquire::http::No-Cache=true` on the install below forces revalidation so a retry cannot
        # be re-served the same cached response — `rm -rf /var/lib/apt/lists/*` already forces a
        # fresh INDEX; this forces fresh PACKAGE fetches, which is the layer that was actually
        # failing here. The backoff is lengthened (attempt*10, up to 40s between tries) because an
        # edge cache needs real wall-clock time to invalidate, and the previous, shorter backoff
        # completed its whole 5-attempt run in about 25 seconds — not long enough to matter.
        #
        # Neither cause is "the pool prunes superseded files as point releases land" — that
        # framing (an earlier, wrong hypothesis in this file's history) does not match either
        # measurement above and should not be reintroduced without new evidence.
        #
        # SEPARATE, TRACKED ELSEWHERE, NOT ADDRESSED HERE: bullseye-security's Release file states
        # `Valid-Until: Mon, 07 Sep 2026 21:13:04 UTC` — bullseye is oldoldstable, and once that
        # date passes apt will reject the index outright ("Release file expired") regardless of
        # host or cache state. Tracked as dig-node#565 (bullseye EOL / base-image decision). Do NOT
        # silence it with `Acquire::Check-Valid-Until "false"` and do NOT change the base image
        # here — that call is the coordinator's, not a side effect of this fix.
        run: |
          set -eux
          sed -i 's#http://deb.debian.org/debian-security#http://security.debian.org/debian-security#' /etc/apt/sources.list
          for attempt in 1 2 3 4 5; do
            if apt-get update -qq && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::No-Cache=true ca-certificates curl git; then
              exit 0
            fi
            echo "apt bootstrap attempt $attempt/5 failed -- resetting apt/dpkg state and retrying" >&2
            dpkg --configure -a || true
            apt-get -f install -y || true
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            sleep $(( attempt * 10 ))
          done
          echo "::error::apt bootstrap failed after 5 attempts" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Trust the checkout (git runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: setup
        uses: ./.github/actions/setup-linux-build
      - run: rustc --version && cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The glibc floor is part of the cache key: artifacts built against a different glibc must
          # never be restored into a build that claims a different floor.
          key: linux-glibc${{ steps.setup.outputs.glibc-floor }}-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-glibc${{ steps.setup.outputs.glibc-floor }}-build-${{ matrix.target }}-
      - name: Build release binaries (dig-node + dign alias)
        # The triple is the HOST's here (native build, no cross-compilation), but it is passed
        # explicitly anyway so the output lands in `target/<triple>/release/` — the one path the
        # shared staging action reads on every platform.
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dig-node --bin dign
      - uses: ./.github/actions/stage-binaries
        with:
          version: ${{ inputs.version }}
          target: ${{ matrix.target }}
          out-name: ${{ matrix.out_name }}
      - name: Assert the glibc floor of the produced binaries
        # The gate that makes the floor durable. Both binaries are checked: `dign` is a separate
        # link, so checking only `dig-node` would leave the alias unguarded.
        run: |
          set -eu
          for stem in dig-node dign; do
            bin="dist/${stem}-${{ inputs.version }}-${{ matrix.out_name }}"
            bash scripts/check-glibc-floor.sh "$bin" "${{ steps.setup.outputs.glibc-floor }}"
            # Prove the gate is not a no-op against a REAL binary, not just against the unit
            # tests' stub readelf: every ELF references at least the base glibc version
            # (2.2.5 on x86_64, 2.17 on aarch64), so a floor of 2.0 MUST be rejected. A gate that
            # cannot fail is a rubber stamp.
            if bash scripts/check-glibc-floor.sh "$bin" 2.0 >/dev/null 2>&1; then
              echo "::error::check-glibc-floor.sh accepted an impossible 2.0 floor for $bin — the gate is not working"
              exit 1
            fi
          done

  # PROOF, not inference: start each published Linux binary on the OLDEST distros it claims to
  # support. `ldd --version` on the builder says what the binary was linked against; only executing
  # it on the target says it STARTS there. #1736 was found by a binary that died at exec time.
  #
  # WHY `--version`: it is the one invocation that touches no config, no network, no filesystem
  # state and no service manager, so it isolates "does the dynamic loader resolve this binary".
  verify-linux-floor:
    name: verify (${{ matrix.out_name }} on ${{ matrix.image }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three distros #1736 reported broken, each on its own arch's runner so the binary
          # executes natively rather than under emulation.
          - runner: ubuntu-latest
            out_name: linux-x64
            image: ubuntu:22.04
          - runner: ubuntu-latest
            out_name: linux-x64
            image: debian:12
          - runner: ubuntu-latest
            out_name: linux-x64
            image: amazonlinux:2023
          - runner: ubuntu-24.04-arm
            out_name: linux-arm64
            image: ubuntu:22.04
          - runner: ubuntu-24.04-arm
            out_name: linux-arm64
            image: debian:12
          - runner: ubuntu-24.04-arm
            out_name: linux-arm64
            image: amazonlinux:2023
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dig-node-${{ matrix.out_name }}
          path: dist
      - name: Run both binaries on ${{ matrix.image }}
        run: |
          set -eu
          chmod +x dist/*
          for stem in dig-node dign; do
            bin="${stem}-${{ inputs.version }}-${{ matrix.out_name }}"
            echo "::group::$bin on ${{ matrix.image }}"
            # `ldd` FIRST and unconditionally: the dynamic loader names only the FIRST
            # unsatisfied library, so a partial fix reads as a brand-new regression. Logging the
            # full dependency set makes the real remaining gap visible in one run.
            docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" \
              sh -c "ldd /dist/$bin || true"
            docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" \
              /dist/$bin --version
            echo "::endgroup::"
          done
