# ─────────────────────────────────────────────────────────────────────────────────────────────
# The nightly + manual-dispatch RELEASE ORCHESTRATOR (dig_ecosystem #590/#592). Copied from the
# ecosystem's REFERENCE nightlies implementation (DIG-Network/dig-updater) and adapted to
# dig-node's build. The normative contract is SPEC.md §11; the ops runbook is runbooks/release.md.
#
# It replaces the old "tag-and-release-on-every-merge-to-main" model. Releases are no longer cut
# per merge; they are batched to a nightly cron (+ manual dispatch), across two channels:
#
#   • STABLE channel  (job `stable`): the unchanged changelog+tag logic, now driven by the cron
#     instead of push-to-main. It reads the version from Cargo.toml and cuts `vX.Y.Z` ONLY when
#     that tag does not already exist — i.e. only when the version file was bumped since the last
#     release (an unchanged version = the tag exists = a no-op). Cutting the tag = git-cliff
#     regenerates CHANGELOG.md, commits it to main, tags that commit `vX.Y.Z`, and pushes both
#     with RELEASE_TOKEN. The pushed `v*` tag then fires the STABLE binary build+publish
#     (release.yml). This is the SAME stable path as before — only its trigger changed.
#
#   • NIGHTLY channel (jobs `nightly-meta` → `nightly-build` → `nightly-publish`): every night it
#     builds `main` HEAD and publishes a GitHub PRE-release (never `latest`) under a dated tag
#     `nightly-YYYYMMDD` plus a force-moved rolling `nightly` tag, so there is ALWAYS a fresh
#     nightly regardless of whether the version was bumped. It synthesizes a semver-prerelease
#     version `X.Y.Z-nightly.YYYYMMDD.<shortsha>` at BUILD time (nothing is committed) and prunes
#     dated nightlies down to a retention window.
#
# Manual invocation (`workflow_dispatch`) drives EITHER channel on demand — choose `stable`,
# `nightly`, or `both`; `force` re-cuts a stable release even when the version is unchanged.
#
# RELEASE_TOKEN posture (both channels): a tag pushed by the default GITHUB_TOKEN does NOT trigger
# downstream workflows (GitHub anti-recursion) and GITHUB_TOKEN cannot push past branch protection,
# so releases use the RELEASE_TOKEN org PAT. If RELEASE_TOKEN is absent, every channel NO-OPS with
# a clear warning instead of half-releasing — add the org secret to enable releases.
#
# 60-day auto-disable (GitHub platform behavior, not this workflow's): GitHub disables a
# `schedule:` trigger after 60 days with NO repo activity on a public repo, with no auto-re-enable
# — and since #590 removed the push-to-main trigger, this cron is the ONLY automatic release
# path. If nightlies silently stop, check `gh api repos/<owner>/<repo>/actions/workflows/
# nightly-release.yml --jq .state` and re-enable with `gh workflow enable nightly-release.yml`
# (see runbooks/release.md + SPEC.md §11.1).
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: Nightly + stable release

on:
  # Midnight UTC — GitHub Actions cron is ALWAYS UTC. GitHub may delay a top-of-hour cron under
  # load; that is acceptable here (a nightly a little late is fine, and the stable channel is
  # idempotent — a delayed or skipped run just re-checks next time).
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel(s) to release."
        type: choice
        options: [both, stable, nightly]
        default: both
      force:
        description: "Force a STABLE release even if the version is unchanged (re-cut the tag)."
        type: boolean
        default: false

concurrency:
  # Serialize release runs so an overlapping cron + manual dispatch can never race on tags/releases.
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ───────────────────────────────── STABLE channel ─────────────────────────────────
  # The converted on-merge tagger: version-detect → skip-if-already-tagged → git-cliff changelog
  # → commit + tag + push (RELEASE_TOKEN). The pushed `v*` tag fires release.yml (the binary build).
  stable:
    name: Stable — changelog + tag
    # Run on the schedule (both channels) or when dispatch selects stable/both. The
    # `!startsWith(...chore(release):...)` guard is preserved from the on-merge era: it is INERT on
    # schedule/dispatch (there is no `head_commit`), but it keeps the release changelog commit
    # self-labelled so the loop stays safe even if a push trigger is ever re-introduced.
    if: >-
      ${{
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        (github.event_name == 'schedule' || inputs.channel == 'stable' || inputs.channel == 'both')
      }}
    runs-on: ubuntu-latest
    # Consumed by `stable-verify-assets` below, which must know WHETHER a tag was actually cut
    # (a no-op run must not verify anything) and WHICH tag to verify.
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Require RELEASE_TOKEN (else no-op)
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set on this repo. The stable changelog+tag release is a NO-OP until the org-level PAT secret is added (see runbooks/release.md + SPEC.md §11). Nothing will be released."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          # Pin to `main` explicitly (opus review of #592): a schedule/dispatch run already
          # defaults to the branch it ran on, but pinning makes the `HEAD:main` push below
          # unambiguous — the changelog commit + tag can only ever land on `main` HEAD.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # Refuse to cut a stable tag while any dig-constants copy predates the real DIG L2 genesis.
      #
      # dig-constants 0.1.0 shipped an all-zeros PLACEHOLDER genesis challenge and derived all six
      # AGG_SIG domains FROM it, so the whole set was self-consistent and no test could see it. It
      # reached production through a dig-clvm git rev into dig-wallet's spend validator
      # (dig_ecosystem#2316). 0.4.0 is the first release with the real value. Below that floor this
      # binary carries a different chain identity than the network it is talking to.
      #
      # Placed BEFORE version resolution deliberately: the point is that no tag exists to deploy,
      # not that a bad build is caught later. Releasing is the moment the drift escapes the repo.
      #
      # The step also WARNS — without blocking — when dig-constants resolves to several versions at
      # once, naming the package that pins each one. That stays advisory because the pins live in
      # published metadata this repo cannot edit, so blocking on it would ban releasing until a
      # five-repo publish cascade lands (dig_ecosystem#2072).
      #
      # Invoked as `bash scripts/...`, matching how build-binaries.yml calls check-glibc-floor.sh:
      # the exec bit is set in git, but not depending on it is what keeps a mode-100644 checkout
      # from failing the release with a bare "Permission denied".
      - name: Require dig-constants at or above the real-genesis floor
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: bash scripts/check-dig-constants-current.sh

      - name: Resolve version + skip if already tagged
        if: steps.token.outputs.present == 'true'
        id: ver
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          crg() {
            [ -f Cargo.toml ] || { echo ""; return; }
            python3 -c 'import tomllib; d=tomllib.load(open("Cargo.toml","rb")); v=d.get("package",{}).get("version") or d.get("workspace",{}).get("package",{}).get("version") or ""; print(v if isinstance(v,str) else "")' 2>/dev/null || echo ""
          }
          VER="$(crg)"
          if [ -z "$VER" ]; then echo "skip=true" >>"$GITHUB_OUTPUT"; echo "No version file — nothing to release."; exit 0; fi
          TAG="v$VER"
          # The idempotency keystone: an unchanged version means `vX.Y.Z` already exists, so the
          # run is a no-op — UNLESS `force` was requested (a manual re-cut of the same version).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              # Supply-chain guard: a PUBLISHED release is a shipped artifact — force-moving its
              # tag onto a different commit would silently overwrite that version's binaries with
              # code nobody reviewed under it. Only allow the re-cut when it is SAFE: the tag
              # already points at the commit we're about to build (a legitimate "the build
              # failed, re-fire release.yml" retry), or the tag has no published release yet (a
              # repair of a bare/failed tag). Resolve the tag's commit locally first, falling back
              # to the remote (mirrors the existence check above, which is dual local/remote too).
              TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
              if [ -z "$TAG_COMMIT" ]; then
                TAG_COMMIT="$(git ls-remote origin "refs/tags/$TAG^{}" 2>/dev/null | cut -f1)"
              fi
              if [ -z "$TAG_COMMIT" ]; then
                TAG_COMMIT="$(git ls-remote origin "refs/tags/$TAG" 2>/dev/null | cut -f1)"
              fi
              HEAD_COMMIT="$(git rev-parse HEAD)"
              IS_PUBLISHED_RELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' 2>/dev/null || echo "false")"
              if [ "$IS_PUBLISHED_RELEASE" = "true" ] && [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
                echo "::error::refusing to force-move $TAG — a PUBLISHED release already exists for it and the tag points at a different commit ($TAG_COMMIT) than this run's target ($HEAD_COMMIT). force is only for re-cutting the SAME commit (a failed-build retry) or repairing a tag with no published release. Bump the version instead of overwriting a shipped release."
                exit 1
              fi
              echo "Tag $TAG already exists but force=true — re-cutting (the tag will be moved)."
              echo "force=true" >>"$GITHUB_OUTPUT"
            else
              echo "skip=true" >>"$GITHUB_OUTPUT"; echo "Tag $TAG already exists — no-op."; exit 0
            fi
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Install git-cliff
        if: steps.token.outputs.present == 'true' && steps.ver.outputs.skip == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        if: steps.token.outputs.present == 'true' && steps.ver.outputs.skip == 'false'
        run: git-cliff --config cliff.toml --tag "${{ steps.ver.outputs.tag }}" --output CHANGELOG.md

      - name: Commit changelog, tag, push
        if: steps.token.outputs.present == 'true' && steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          FORCE_TAG: ${{ steps.ver.outputs.force }}
        run: |
          set -euo pipefail
          git config user.name "dig-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add CHANGELOG.md
          # `chore(release):` prefix labels the release commit so a re-introduced push trigger would
          # skip it (the loop guard on the job `if:`).
          git commit -m "chore(release): ${{ steps.ver.outputs.tag }}" || echo "changelog unchanged"
          # A `force` re-cut moves an existing tag onto the fresh changelog commit; a normal cut
          # creates a new tag. Main is NEVER force-pushed. NOTE (opus review of #592): a force-moved
          # tag breaks git tag-immutability for that version — acceptable ONLY for the guarded
          # retry/repair cases above. dig-node updates are gated by the dig-updater signed feed
          # (the beacon verifies an Ed25519 signature over the update descriptor before applying),
          # so that SIGNATURE — not the mutable git tag — is the integrity layer consumers rely on.
          if [ "$FORCE_TAG" = "true" ]; then
            git tag -f -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
            git push origin "HEAD:main"
            git push -f origin "${{ steps.ver.outputs.tag }}"
          else
            git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
            git push origin "HEAD:main"
            git push origin "${{ steps.ver.outputs.tag }}"
          fi
          echo "Pushed changelog commit + ${{ steps.ver.outputs.tag }} — release.yml (stable build) should now fire."

      # THE TAG-PUSH EVENT IS NOT A GUARANTEE (dig_ecosystem#2290).
      #
      # Everything the stable channel produces — the binaries (release.yml) and the native install
      # packages (package.yml) — hangs off ONE thing: GitHub delivering a `push` event for the tag
      # above and creating a workflow run from it. That is an at-most-once delivery this repo does
      # not control, and on 2026-08-06 it simply did not happen. The push itself succeeded
      # (`* [new tag] v0.99.9 -> v0.99.9`) and the branch push one second earlier DID create a run,
      # but the tag created NONE. Neither release.yml nor package.yml ran. The release was then
      # repaired by hand by dispatching release.yml alone, which produced a `latest` release of
      # bare binaries — and because feedsign resolves dig-node by its native-package names, that
      # froze the stable signed feed for every product until the manifest expired.
      #
      # So the tag push is treated as a REQUEST, and this step confirms it was honoured. Where a
      # run is missing, it is dispatched explicitly against the tag ref, which is equivalent: both
      # workflows gate their publish on `github.ref_type == 'tag'`, which a dispatch against a tag
      # satisfies. The step is idempotent — it dispatches only what is absent, so on the normal
      # path (both runs present) it does nothing at all.
      #
      # This deliberately does NOT restructure the release into `workflow_call` jobs. Both
      # workflows already publish to the tag's release, and adding a second publisher for the same
      # assets would trade a rare lost event for a routine race.
      - name: Confirm the tag push actually created the release runs
        if: steps.token.outputs.present == 'true' && steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          FORCE_TAG: ${{ steps.ver.outputs.force }}
        run: |
          set -euo pipefail

          # A run "for this tag" must mean a run for THIS CUT of the tag, not merely one that
          # carried the same tag NAME at some point. `gh run list --branch` matches on the name
          # alone, and a tag name is not stable: a `force` re-cut moves it onto a new commit. So
          # the commit is the identity, and the run's `headSha` is what is compared.
          #
          # Without that, a force re-cut whose tag event is lost finds the PREVIOUS cut's runs,
          # dispatches nothing, and the asset guard then passes on the PREVIOUS cut's packages —
          # a green release run shipping stale binaries under a moved tag, wearing exactly the
          # success signature of a correct release. That is the failure class this step exists to
          # remove, so it must not be reachable through the step itself.
          TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"

          runs_for_this_cut() {
            gh run list --repo "$REPO" --workflow "$1" --branch "$TAG" \
              --json headSha --jq "[.[] | select(.headSha == \"$TAG_COMMIT\")] | length"
          }

          # A force re-cut ALWAYS dispatches, without consulting history. The documented reason to
          # force is "the build failed, re-fire it" — and a failed run is still a run at the right
          # commit, so any count-based check reads the wreckage of the previous attempt as success
          # and turns the retry into a silent no-op that then burns the guard's full timeout before
          # going red. Re-cutting is an explicit request for fresh builds; treat it as one.
          if [ "${FORCE_TAG:-}" = "true" ]; then
            echo "force re-cut of $TAG at $TAG_COMMIT — dispatching both release workflows unconditionally (a re-cut is a request for fresh builds; an earlier run at this tag may be the failed one being retried)."
            for wf in release.yml package.yml; do
              gh workflow run "$wf" --repo "$REPO" --ref "$TAG"
            done
            exit 0
          fi

          # Run creation is asynchronous; give the event a fair chance before declaring it lost.
          # A false "lost" is cheap here (the dispatch is idempotent and the publish is tag-gated),
          # but waiting avoids a pointless duplicate run on every single release.
          for _ in $(seq 1 12); do
            sleep 10
            [ "$(runs_for_this_cut release.yml)" -gt 0 ] && [ "$(runs_for_this_cut package.yml)" -gt 0 ] && break
          done

          for wf in release.yml package.yml; do
            if [ "$(runs_for_this_cut "$wf")" -gt 0 ]; then
              echo "$wf: the tag push created a run for $TAG at $TAG_COMMIT."
              continue
            fi
            echo "::warning::$wf did NOT run for $TAG at $TAG_COMMIT — the tag-push event was not delivered. Dispatching it explicitly against the tag ref so the release is not published incomplete."
            gh workflow run "$wf" --repo "$REPO" --ref "$TAG"
          done

  # The stable channel's ACCEPTANCE TEST (dig_ecosystem#2290). Cutting a tag and dispatching the
  # builds is a request; this is the confirmation. It blocks until the published release carries
  # the native install packages dig-updater's feedsign resolves dig-node by, and reddens this
  # release run if it never does.
  #
  # It exists because every layer above it can report success while the release is unusable: the
  # stable job succeeds when the tag is pushed, release.yml succeeds when the binaries are
  # attached, and neither knows or cares whether the packages arrived. The only signal that a
  # stable release is actually shippable is the asset list itself, and until now nobody read it.
  # The consequence landed in a different repo hours later (dig-updater's feed.yml failing closed),
  # which is the worst possible place for it to surface.
  #
  # Skipped on a no-op run (`stable` found the version already tagged, so `tag` is empty).
  stable-verify-assets:
    name: Stable — verify release assets
    needs: stable
    if: needs.stable.outputs.tag != ''
    uses: ./.github/workflows/verify-release-assets.yml
    with:
      tag: ${{ needs.stable.outputs.tag }}

  # ───────────────────────────────── NIGHTLY channel ─────────────────────────────────
  # 1) meta: gate on the token + synthesize the nightly version and tags (nothing is committed).
  nightly-meta:
    name: Nightly — resolve version
    if: >-
      ${{ github.event_name == 'schedule' || inputs.channel == 'nightly' || inputs.channel == 'both' }}
    runs-on: ubuntu-latest
    outputs:
      token_present: ${{ steps.token.outputs.present }}
      version: ${{ steps.v.outputs.version }}
      dated_tag: ${{ steps.v.outputs.dated_tag }}
      title: ${{ steps.v.outputs.title }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Require RELEASE_TOKEN (else no-op)
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set on this repo. The nightly pre-release is a NO-OP until the org-level PAT secret is added (see runbooks/release.md + SPEC.md §11)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Synthesize the nightly version + tags
        if: steps.token.outputs.present == 'true'
        id: v
        shell: bash
        run: |
          set -euo pipefail
          crg() {
            python3 -c 'import tomllib; d=tomllib.load(open("Cargo.toml","rb")); v=d.get("package",{}).get("version") or d.get("workspace",{}).get("package",{}).get("version") or ""; print(v if isinstance(v,str) else "")'
          }
          BASE="$(crg)"                      # e.g. 0.31.2 (the current Cargo.toml version)
          DATE="$(date -u +%Y%m%d)"          # e.g. 20260714 (UTC)
          DATE_DASH="$(date -u +%Y-%m-%d)"   # e.g. 2026-07-14 (UTC, for the human title)
          SHORTSHA="$(git rev-parse --short HEAD)"
          FULLSHA="$(git rev-parse HEAD)"
          # Semver PRERELEASE version — sorts BELOW the plain `X.Y.Z`, so a nightly never outranks
          # the stable release of the same version. Built at CI time; never committed.
          echo "version=${BASE}-nightly.${DATE}.${SHORTSHA}" >> "$GITHUB_OUTPUT"
          echo "dated_tag=nightly-${DATE}" >> "$GITHUB_OUTPUT"
          echo "title=Nightly ${DATE_DASH} (${SHORTSHA})" >> "$GITHUB_OUTPUT"
          echo "sha=${FULLSHA}" >> "$GITHUB_OUTPUT"

  # 2) build: the SAME reusable cross-OS build the stable release uses, stamped with the nightly
  #    version. Skipped (with the whole channel) when the token is absent.
  nightly-build:
    name: Nightly — build
    needs: nightly-meta
    if: needs.nightly-meta.outputs.token_present == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.nightly-meta.outputs.version }}
      ref: ${{ needs.nightly-meta.outputs.sha }}

  # 2b) packages: the NATIVE install packages, from the same shared definitions the stable tag path
  #     uses (dig_ecosystem#618). Raw binaries alone make the nightly channel non-installable: the
  #     beacon installs dig-node by handing a native package to msiexec/installer/dpkg, and
  #     dig-updater's feedsign therefore resolves dig-node's assets by their native-package file
  #     names — so a binaries-only nightly failed its feed build with `no matching release assets`,
  #     reddening the signed feed for every channel. Stamped with the SAME synthesized version and
  #     built from the SAME commit as the binaries, so one release never mixes two trees.
  #
  #     amd64 `.deb` only: feedsign's platform set has exactly one Linux entry (`linux/x64`), so a
  #     nightly arm64 `.deb` would be built every night and resolved by nobody. apt.dig.net's arm64
  #     index is fed by the STABLE tag path, which keeps both legs.
  nightly-packages:
    name: Nightly — native packages
    needs: nightly-meta
    if: needs.nightly-meta.outputs.token_present == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.nightly-meta.outputs.version }}
      ref: ${{ needs.nightly-meta.outputs.sha }}
      deb_arches: '[{"runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","dpkg_arch":"amd64"}]'

  # 3) publish: attach the built binaries + native packages to a dated + rolling PRE-release, then
  #    prune old nightlies. Uses RELEASE_TOKEN for git tag + gh release operations (same identity as
  #    stable).
  nightly-publish:
    name: Nightly — publish + prune
    needs: [nightly-meta, nightly-build, nightly-packages]
    if: needs.nightly-meta.outputs.token_present == 'true'
    runs-on: ubuntu-latest
    env:
      # How many dated `nightly-YYYYMMDD` pre-releases to retain; older ones (and their tags) are
      # pruned each run. The rolling `nightly` and all `v*` stable releases are NEVER pruned.
      KEEP_NIGHTLIES: 14
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
      DATED_TAG: ${{ needs.nightly-meta.outputs.dated_tag }}
      TITLE: ${{ needs.nightly-meta.outputs.title }}
    steps:
      - name: Checkout (with push credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        env:
          VERSION: ${{ needs.nightly-meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
          # Fail CLOSED on a missing native package (dig_ecosystem#618). These three file names are
          # exactly what dig-updater's feedsign resolves for a native-package component — it strips a
          # fixed head/tail off the asset NAME to recover a rolling nightly's version, so a name that
          # is absent or misspelt is indistinguishable from "there is no nightly". Asserting them
          # here turns that into a red publish rather than a published-but-unusable release, which is
          # how the channel stayed broken for weeks: every job was green.
          missing=0
          for asset in \
            "dig-node_${VERSION}_amd64.deb" \
            "dig-node-${VERSION}-macos.pkg" \
            "dig-node-${VERSION}-windows-x64.msi"; do
            if [ ! -f "release/$asset" ]; then
              echo "::error::nightly is missing the native package '$asset' — dig-updater's feedsign resolves dig-node by these exact asset names, so publishing without it would leave the nightly channel non-installable."
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Move nightly tags (dated + rolling) to this build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dig-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          # Force so a same-day re-run (or the moving rolling pointer) is idempotent. Neither
          # `nightly-*` nor `nightly` matches release.yml's `v*` trigger, so no stable build fires.
          git push -f origin "HEAD:refs/tags/${DATED_TAG}"
          git push -f origin "HEAD:refs/tags/nightly"

      - name: Publish the dated + rolling pre-releases
        shell: bash
        run: |
          set -euo pipefail
          NOTES="Automated nightly pre-release built from \`main\` HEAD (${TITLE}). Version \`${{ needs.nightly-meta.outputs.version }}\`. Pre-release — NOT a stable release; for alpha testers tracking the nightly channel."

          # Ensure a prerelease exists at the tag, keep its metadata current, and replace ALL of
          # its assets with THIS run's binaries (filenames carry the date+sha, so a stale asset
          # would otherwise linger — clear then upload). Applied to both the immutable dated tag
          # and the rolling `nightly` pointer.
          #
          # Delete-then-upload (not `gh release upload --clobber`) is intentional, not an
          # oversight: each night's filenames embed that day's date+shortsha, so `--clobber`
          # (which only overwrites SAME-named assets) would never remove the PREVIOUS night's
          # differently-named leftovers from the rolling `nightly` release — a stale-then-fresh
          # asset pair would accumulate forever. This does leave a brief assetless window on the
          # release mid-step; acceptable for this nightly PRE-release channel (stable releases
          # never take this path).
          refresh_release() {
            local tag="$1"
            gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$REPO" --verify-tag \
                   --prerelease --latest=false --title "$TITLE" --notes "$NOTES"
            gh release edit "$tag" --repo "$REPO" --prerelease --latest=false --title "$TITLE" >/dev/null
            gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' \
              | while read -r asset; do
                  [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --repo "$REPO" --yes
                done
            gh release upload "$tag" release/* --repo "$REPO"
          }

          refresh_release "${DATED_TAG}"
          refresh_release "nightly"
          echo "Published ${DATED_TAG} + moved rolling nightly."

      - name: Prune old nightlies (keep newest KEEP_NIGHTLIES + the rolling tag)
        shell: bash
        run: |
          set -euo pipefail
          # `gh release list` runs as its own un-swallowed statement — a real listing failure
          # (auth/API/network) reds this step per `set -e`, rather than being masked into a silent
          # empty-prune. Only the DOWNSTREAM grep's exit 1 (its normal "no dated nightlies matched"
          # on a quiet/new repo) is tolerated — a listing failure surfaces, a genuine empty match
          # does not.
          ALL_TAGS="$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')"
          # Dated nightly tags ONLY: `nightly-YYYYMMDD` sorts chronologically as text, so `sort -r`
          # is newest-first. The rolling `nightly` and every `v*` stable tag are excluded by the
          # pattern and are never touched.
          mapfile -t dated < <(
            printf '%s\n' "$ALL_TAGS" | grep -E '^nightly-[0-9]{8}$' | sort -r || [ $? -eq 1 ]
          )
          # Everything past the newest KEEP_NIGHTLIES is pruned — release AND git tag together.
          for tag in "${dated[@]:$KEEP_NIGHTLIES}"; do
            echo "Pruning old nightly: $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
          done
          echo "Retention: kept newest $KEEP_NIGHTLIES dated nightlies + the rolling nightly."
