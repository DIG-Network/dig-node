# The RELEASE ASSET GUARD (dig_ecosystem#2290, widened by dig-node#335).
#
# A `vX.Y.Z` release of dig-node is not shippable just because a release object exists. Two
# separate consumers resolve assets out of it, and a release that satisfies one and not the other
# is broken for real users:
#
#   * dig-updater's feedsign resolves dig-node by the NATIVE INSTALL PACKAGE file names and FAILS
#     CLOSED on the whole signed manifest when one cannot be resolved. `v0.99.9` shipped binaries
#     only, and the stable manifest sat frozen and then EXPIRED for ~15 hours while every
#     individual workflow run in this repo reported success.
#   * dig-installer resolves the RAW `dig-node` and `dign` binaries through `releases/latest`.
#     `v0.145.0` became `latest` carrying only the four native packages, five minutes before its
#     binaries were attached, and every fresh install 404'd for that window (dig-node#335).
#
# The expected set for BOTH consumers lives in one place —
# `.github/actions/check-release-assets` — and this workflow is how it gets asked.
#
#   * workflow_call — the stable release paths (nightly-release.yml after cutting the tag, and
#     release.yml before promoting the release to `latest`) wait on this, so an incomplete release
#     reddens the release run itself rather than surfacing hours later as a feed failure in
#     another repo or a 404 on a user's machine.
#   * workflow_dispatch — point it at ANY tag on demand.
#   * pull_request — the SELF-TEST below, which is what makes the guard falsifiable without
#     needing a broken release to exist.
#
# It polls rather than sampling once, because the binaries and the packages are attached by
# separate workflows that finish at different times; a single sample would race them and produce a
# red that only means "not finished yet".
name: Verify release assets

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to verify (e.g. v0.99.9)."
        type: string
        required: true
      timeout_minutes:
        description: >-
          How long to wait for the assets to appear before failing. The default spans a cold
          cross-OS package build (the .msi and .pkg legs dominate).
        type: number
        required: false
        default: 75
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to verify (e.g. v0.99.9)."
        type: string
        required: true
      timeout_minutes:
        description: "How long to wait for the assets to appear before failing."
        type: number
        required: false
        default: 5
  pull_request:
    paths:
      - ".github/actions/check-release-assets/**"
      - ".github/workflows/verify-release-assets.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.tag }} carries every consumer-resolvable asset
    # The self-test trigger supplies no tag; it exercises `selftest` instead.
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-release-assets
        with:
          tag: ${{ inputs.tag }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
          github_token: ${{ github.token }}

  # THE GUARD'S OWN REGRESSION TEST (dig-node#335).
  #
  # The reason #335 shipped is that the previous guard checked only the four native packages, so
  # it reported success on a release missing all ten binaries. Nothing could have caught that,
  # because nothing ever asked the guard to fail.
  #
  # This job asks. It drives the SAME action the release path uses, over literal asset lists:
  #
  #   * the complete v0.145.0 set MUST pass — a guard that rejects a good release is just as
  #     broken, and this is the control that keeps the expectation from drifting into something
  #     unsatisfiable;
  #   * a set missing every `dign-*` binary — EXACTLY the shape `releases/latest` had at
  #     2026-08-24T01:47:49Z — MUST fail. `continue-on-error` lets the step run to completion, and
  #     the assertion afterwards turns a PASS into a red job.
  #
  # The failing case deliberately omits a whole consumer's set rather than one stray file, because
  # the defect was categorical: an entire class of asset was outside the guard's vocabulary.
  selftest:
    name: Self-test — the guard passes a complete release and FAILS an incomplete one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: A complete asset set PASSES
        uses: ./.github/actions/check-release-assets
        with:
          tag: v0.145.0
          assets: |
            dig-node_0.145.0_amd64.deb
            dig-node_0.145.0_arm64.deb
            dig-node-0.145.0-macos.pkg
            dig-node-0.145.0-windows-x64.msi
            dig-node-0.145.0-linux-arm64
            dig-node-0.145.0-linux-x64
            dig-node-0.145.0-macos-arm64
            dig-node-0.145.0-macos-x64
            dig-node-0.145.0-windows-x64.exe
            dign-0.145.0-linux-arm64
            dign-0.145.0-linux-x64
            dign-0.145.0-macos-arm64
            dign-0.145.0-macos-x64
            dign-0.145.0-windows-x64.exe

      - name: An incomplete asset set is checked (expected to fail)
        id: incomplete
        continue-on-error: true
        uses: ./.github/actions/check-release-assets
        with:
          # The four native packages and nothing else — the exact asset list `releases/latest`
          # carried while dig-installer was 404ing (dig-node#335). The PREVIOUS guard passed this.
          tag: v0.145.0
          assets: |
            dig-node_0.145.0_amd64.deb
            dig-node_0.145.0_arm64.deb
            dig-node-0.145.0-macos.pkg
            dig-node-0.145.0-windows-x64.msi

      - name: Require that it FAILED
        shell: bash
        env:
          OUTCOME: ${{ steps.incomplete.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::the release-asset guard PASSED a release carrying only the four native install packages. That is the dig-node#335 defect verbatim: dig-installer resolves the raw dig-node and dign binaries through releases/latest, so this asset set 404s every fresh install. The guard is not guarding."
            exit 1
          fi
          echo "The guard failed the incomplete asset set, as required."
