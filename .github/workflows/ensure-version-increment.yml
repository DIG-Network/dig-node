# Ensure the project version is incremented in every PR before it can merge to the default branch.
# Looks for BOTH package.json and Cargo.toml:
#   - only package.json present  -> its version must increase vs the base branch
#   - only Cargo.toml present     -> its version must increase vs the base branch
#   - BOTH present                -> both must increase AND equal each other on this branch
#   - neither present             -> nothing to enforce (passes)
# Version files added new on this branch (absent on base) pass. Modeled on Chia-Network/cadt.
#
# The comparison is written to the job summary on EVERY run, pass or fail (dig-node#364). A stale
# bump is invisible everywhere else: `git status`, the diff, fmt, clippy and the test suite are all
# green when `main` has taken your version number, and a rebase can drop the bump commit entirely as
# "already upstream". This gate is the only thing that holds both numbers, so it is the only place
# the comparison can be surfaced -- and being able to read it WHILE the gate is green is what turns
# a merge-time surprise into something a long-lived review round can notice.
#
# Also validates that the head Cargo.toml version can produce a legal MSI ProductVersion
# (dig_ecosystem#521, dig_ecosystem#522). `scripts/package-version.sh` already enforces that
# whitelist, but it previously ran ONLY inside `Native install packages` (package.yml), which is
# NOT a required check -- a red package build never blocked a merge. Six PRs merged carrying an
# unbuildable version before anyone noticed. This job IS required, so folding the same validation
# in here (reusing the checkout this job already does, calling the real script rather than a second
# copy of its limits) makes an unbuildable version fail fast, on a required check, in ~1s -- instead
# of discovering it tens of minutes later in a build job nobody is blocked on. package.yml's build
# jobs stay non-required on purpose: they can legitimately flake on build infra (an apt mirror
# timeout has failed `build .deb` with the version itself perfectly valid), and a flaky multi-minute
# job has no business gating every merge.
name: Check Version Increment

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check version increment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: branch-repo

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: base-repo

      - name: Check version increment
        shell: bash
        run: |
          set -euo pipefail

          # Extract a version from package.json (.version) or Cargo.toml
          # ([package].version or [workspace.package].version). Empty string if
          # the file or the field is absent.
          pkg_version() {
            local f="$1/package.json"
            [ -f "$f" ] || { echo ""; return; }
            jq -r '.version // ""' "$f" 2>/dev/null || echo ""
          }
          # [package].version, or [workspace.package].version for workspace roots /
          # members that inherit ({ version.workspace = true }). Empty if absent.
          cargo_version() {
            local f="$1/Cargo.toml"
            [ -f "$f" ] || { echo ""; return; }
            python3 -c 'import sys,tomllib; d=tomllib.load(open(sys.argv[1],"rb")); v=d.get("package",{}).get("version") or d.get("workspace",{}).get("package",{}).get("version") or ""; print(v if isinstance(v,str) else "")' "$f" 2>/dev/null || echo ""
          }

          # strictly-greater semver-ish compare using sort -V; true when $2 > $1
          greater() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]; }

          # One row of the comparison table, to the job summary AND the log.
          # `${GITHUB_STEP_SUMMARY:-/dev/null}` so the script stays runnable outside Actions.
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          row() { printf '| %s | `%s` | `%s` | %s |\n' "$1" "${2:-(absent)}" "${3:-(absent)}" "$4" >> "$SUMMARY"; }

          base_sha=$(git -C base-repo rev-parse --short HEAD)
          head_sha=$(git -C branch-repo rev-parse --short HEAD)
          {
            echo "### Version increment"
            echo
            echo "Comparing this branch against \`main\` at \`$base_sha\` (head \`$head_sha\`)."
            echo
            echo "| manifest | base | head | verdict |"
            echo "| --- | --- | --- | --- |"
          } >> "$SUMMARY"

          B=base-repo
          H=branch-repo
          has_pkg=false; has_cargo=false
          [ -f "$H/package.json" ] && has_pkg=true
          [ -f "$H/Cargo.toml" ] && has_cargo=true

          if [ "$has_pkg" = false ] && [ "$has_cargo" = false ]; then
            echo "No package.json or Cargo.toml at repo root — no version gate to enforce."
            exit 0
          fi

          fail=0

          if [ "$has_pkg" = true ]; then
            bp=$(pkg_version "$B"); hp=$(pkg_version "$H")
            echo "package.json: base='$bp' head='$hp'"
            if [ -n "$bp" ]; then
              if greater "$bp" "$hp"; then
                row "package.json" "$bp" "$hp" "increments"
              else
                echo "::error::package.json version must be incremented ($bp -> $hp) before merging."
                row "package.json" "$bp" "$hp" "**does not increment**"
                fail=1
              fi
            else
              echo "package.json is new on this branch (no base version) — OK."
              row "package.json" "" "$hp" "new on this branch"
            fi
          fi

          if [ "$has_cargo" = true ]; then
            bc=$(cargo_version "$B"); hc=$(cargo_version "$H")
            echo "Cargo.toml: base='$bc' head='$hc'"
            if [ -n "$bc" ]; then
              if greater "$bc" "$hc"; then
                row "Cargo.toml" "$bc" "$hc" "increments"
              else
                echo "::error::Cargo.toml version must be incremented ($bc -> $hc) before merging."
                row "Cargo.toml" "$bc" "$hc" "**does not increment**"
                fail=1
              fi
            else
              echo "Cargo.toml is new on this branch (no base version) — OK."
              row "Cargo.toml" "" "$hc" "new on this branch"
            fi
          fi

          if [ "$has_pkg" = true ] && [ "$has_cargo" = true ]; then
            hp=$(pkg_version "$H"); hc=$(cargo_version "$H")
            if [ -n "$hp" ] && [ -n "$hc" ] && [ "$hp" != "$hc" ]; then
              echo "::error::package.json ($hp) and Cargo.toml ($hc) versions must match each other."
              row "both manifests" "$hp" "$hc" "**disagree with each other**"
              fail=1
            elif [ -n "$hp" ] && [ -n "$hc" ]; then
              row "both manifests" "$hp" "$hc" "agree"
            fi
          fi

          # The verdict, spelled out. A summary showing only rows would leave a reader inferring
          # the outcome from the rows -- which is the inference this whole change exists to remove.
          {
            echo
            if [ "$fail" -eq 0 ]; then
              echo "**PASS** — the version increments over \`main\`."
            else
              echo "**FAIL** — see the rows above. If this branch has been open a while, \`main\`"
              echo "has probably taken your version number, or a rebase dropped the bump commit as"
              echo "\"already upstream\". Re-bump against \`$base_sha\`."
            fi
          } >> "$SUMMARY"

          exit $fail

      - name: Resolve the latest stable release version
        # Feeds `scripts/package-version.sh`'s optional PREV_VERSION argument (dig-node#540 added the
        # check; dig-node#548 wires it in here -- until this step existed, PREV_VERSION was a tested,
        # documented parameter that no caller ever supplied, so the cross-release guard could not fire).
        #
        # `releases/latest` is GitHub's own "most recent published release, excluding prereleases and
        # drafts" endpoint, so nightlies (always `prerelease: true` on this repo's release process,
        # dig_ecosystem CLAUDE.md §3.6-A) are excluded by construction -- belt-and-suspenders alongside
        # PREV_VERSION's own grammar, which separately refuses anything but a bare X.Y.Z.
        #
        # Two failure shapes, deliberately NOT collapsed into one: a 404 means no stable release has
        # EVER been published -- a real, unbounded state with nothing to compare against, not a broken
        # read -- so it is skipped with a plain informational line. Any OTHER failure (rate limit,
        # network blip, a non-404 HTTP error) is ALSO skipped rather than hard-failing every PR on a
        # transient read, but as a `::warning::` so an actual API outage stays visible in the run
        # instead of being silently read as "no releases exist" (dig_ecosystem CLAUDE.md §1.10 --
        # "I could not read X" must never be treated as "X is bad").
        id: prev_release
        shell: bash
        run: |
          # >>> TEMPORARY TEST COMMIT (dig-node#548) <<<
          # Hardcoded to prove the #540 cross-release guard fires through the REAL workflow path.
          # The real `gh api repos/OWNER/REPO/releases/latest` resolves to v0.252.11 today, which has
          # never overflowed MINOR past 255 -- so no legal version bump can organically violate it
          # (proven: any head version that is semver-greater than main's 0.254.72 necessarily has a
          # real MINOR >= 254, which folds to an MSI tuple >= (0,254,x) > (0,252,11)). Fabricating a
          # real GitHub Release just to test CI would pollute this repo's actual release history and
          # the update feed it drives, so this step is hardcoded for ONE commit instead, using the
          # exact worked example from scripts/package-version.sh's own header comment
          # (0.511.0 -> MSI 1.255.0). REVERTED to the real gh api call in the very next commit.
          echo "TEST: hardcoding PREV_VERSION=0.511.0 to prove the #540 guard fires. This step is temporary."
          echo "prev_version=0.511.0" >> "$GITHUB_OUTPUT"

      - name: Validate the head version can produce a legal MSI ProductVersion
        # Runs only when the increment check above passed (default `if:` -- a step is skipped once
        # a prior step in the job has failed), and only when this branch's Cargo.toml carries a
        # bare `X.Y.Z` this script's grammar accepts (package.json-only repos, or a version this
        # repo's OWN increment check already rejected, have nothing here to validate). Calls the
        # SAME script package.yml calls -- a second copy of its limits is exactly the kind of drift
        # dig_ecosystem CLAUDE.md 2.4b exists to prevent.
        #
        # PREV_VERSION (dig-node#548) comes from the step above; an empty value (the bootstrap or
        # API-failure case) is exactly what every OTHER callsite already passes, so the script's
        # behaviour degrades to today's single-argument check rather than failing.
        shell: bash
        env:
          PREV_VERSION: ${{ steps.prev_release.outputs.prev_version }}
        run: |
          set -euo pipefail

          SCRIPT="branch-repo/scripts/package-version.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "No scripts/package-version.sh on this branch -- nothing to validate."
            exit 0
          fi

          HC="$(python3 -c 'import sys,tomllib; d=tomllib.load(open("branch-repo/Cargo.toml","rb")); v=d.get("package",{}).get("version") or d.get("workspace",{}).get("package",{}).get("version") or ""; print(v if isinstance(v,str) else "")' 2>/dev/null || echo "")"
          if [ -z "$HC" ]; then
            echo "No Cargo.toml version on this branch -- nothing to validate."
            exit 0
          fi

          if [ -n "$PREV_VERSION" ]; then
            echo "Validating '$HC' against $SCRIPT, against previous stable release '$PREV_VERSION'..."
          else
            echo "Validating '$HC' against $SCRIPT (the same check package.yml's native-package jobs run)..."
          fi
          if ! bash "$SCRIPT" "$HC" "$PREV_VERSION" >/dev/null; then
            echo "::error::Cargo.toml version '$HC' cannot produce a legal MSI ProductVersion, or its MSI"
            echo "::error::tuple regresses against the previous stable release '$PREV_VERSION' -- every"
            echo "::error::native-package build (.deb amd64/arm64, .msi, .pkg) would fail on it, or a real"
            echo "::error::install of it would abort with DowngradeErrorMessage. See"
            echo "::error::scripts/package-version.sh's own error above for the specific limit hit."
            exit 1
          fi
          echo "'$HC' maps to a legal MSI ProductVersion."
