# A REAL, 3-OS end-to-end smoke test of `dig-node install`/`start`/`uninstall` against the
# actual OS service manager (Windows SCM / systemd / launchd) — the thing ci.yml's mocked
# `ServiceBackend` unit tests (crates/dig-node-service/src/service.rs) cannot prove: that
# `install` registers a service the OS actually starts and serves from, that a SECOND `install`
# cleanly recreates it instead of hitting Windows `CreateService` error 1073 (#494), and that
# `uninstall` actually removes the registration.
#
# Kept as its OWN workflow (not folded into ci.yml) because it performs REAL, mutating
# OS-service registration on every runner — a materially different (and slower/less hermetic)
# kind of check than the rest of the PR gate set.
name: Service smoke test

on:
  pull_request:
    paths:
      - "crates/dig-node-service/src/service.rs"
      - "crates/dig-node-service/src/user_scope.rs"
      - "crates/dig-node-service/src/security.rs"
      - "crates/dig-node-service/src/config.rs"
      - "crates/dig-node-service/src/hosts.rs"
      - "packaging/**"
      - ".github/workflows/service-smoke.yml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NOTE: `DIG_NODE_ALLOW_INSECURE_SERVICE_TARGET` is deliberately NOT set workflow-wide (#526/B5).
  # Setting it here disabled the §565 privileged-target gate in the ONE job where it would otherwise
  # fire, so the gate was never actually exercised by CI. It is now scoped to the single step that
  # genuinely needs it (the Windows system-level install of an unreleased build from the runner's
  # user-writable checkout), and the `system-scope` job below installs into a real root-owned
  # directory so it needs no override at all — and asserts the gate REFUSES when that is not so.

# Least privilege: these jobs only check out the repo and upload artifacts (which uses the job's own
# artifact token, not GITHUB_TOKEN). Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  smoke:
    name: install/start/reinstall/uninstall (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: service-smoke

      - name: Build dig-node (release)
        run: cargo build --release --locked --bin dig-node

      # `dig-node install` registers a USER-level systemd unit on Linux (no root needed), which
      # needs a real user D-Bus session — the GH-hosted runner's non-interactive job shell does
      # not start one implicitly. `enable-linger` + pointing at the per-uid runtime dir brings one
      # up so `systemctl --user ...` (what service-manager shells out to) has a bus to talk to.
      - name: (Linux) bring up a user systemd/D-Bus session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(whoami)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Resolve the built binary path
        id: bin
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "path=target/release/dig-node.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/release/dig-node" >> "$GITHUB_OUTPUT"
          fi

      - name: Install (1st) — fresh registration
        shell: bash
        # Windows SCM registration is always system-level (LocalSystem), and this installs the
        # freshly-built binary from the runner's user-writable checkout — the controlled test/dev
        # case the default-off opt-out exists for. Empty (⇒ gate ENABLED) everywhere else, so the
        # Linux/macOS legs run with the production gate in force.
        env:
          DIG_NODE_ALLOW_INSECURE_SERVICE_TARGET: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          "${{ steps.bin.outputs.path }}" install --json | tee install-1.json
          grep -q '"installed":true' install-1.json
          grep -q '"reinstalled":false' install-1.json

      - name: Windows — assert the SCM display name
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sc.exe qc net.dignetwork.dig-node | tee sc-qc-1.txt
          grep -Eq 'DISPLAY_NAME[[:space:]]*: DIG NETWORK: NODE' sc-qc-1.txt

      - name: Start + poll for RUNNING
        shell: bash
        run: |
          "${{ steps.bin.outputs.path }}" start --json || true
          ok=0
          for _ in $(seq 1 20); do
            if "${{ steps.bin.outputs.path }}" status --json | tee status-1.json | grep -q '"serving":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1

      - name: Install (2nd) — proves clean-reinstall avoids CreateService 1073
        shell: bash
        env:
          DIG_NODE_ALLOW_INSECURE_SERVICE_TARGET: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          "${{ steps.bin.outputs.path }}" install --json | tee install-2.json
          grep -q '"installed":true' install-2.json
          grep -q '"reinstalled":true' install-2.json

      - name: Windows — re-assert the SCM display name after reinstall
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sc.exe qc net.dignetwork.dig-node | tee sc-qc-2.txt
          grep -Eq 'DISPLAY_NAME[[:space:]]*: DIG NETWORK: NODE' sc-qc-2.txt

      - name: Start again + poll for RUNNING
        shell: bash
        run: |
          "${{ steps.bin.outputs.path }}" start --json || true
          ok=0
          for _ in $(seq 1 20); do
            if "${{ steps.bin.outputs.path }}" status --json | tee status-2.json | grep -q '"serving":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1

      - name: Stop
        shell: bash
        run: |
          "${{ steps.bin.outputs.path }}" stop --json

      - name: Uninstall + assert the service is gone
        shell: bash
        run: |
          "${{ steps.bin.outputs.path }}" uninstall --json | tee uninstall.json
          grep -q '"installed":false' uninstall.json
          if [ "${{ runner.os }}" = "Windows" ]; then
            ! sc.exe query net.dignetwork.dig-node
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ! launchctl print "gui/$(id -u)/net.dignetwork.dig-node"
          else
            ! systemctl --user cat net.dignetwork.dig-node.service
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-smoke-${{ matrix.os }}
          path: |
            install-1.json
            install-2.json
            status-1.json
            status-2.json
            uninstall.json
            sc-qc-1.txt
            sc-qc-2.txt
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------------------------
  # #526/B5: REAL evidence for the SYSTEM scope — the path the whole scope feature exists to enable,
  # and the one the matrix job above cannot reach (it never passes `--scope system` and never runs
  # elevated on unix, so all three of its legs exercise `auto` => user scope, i.e. the old behaviour).
  #
  # This job installs the built binary into a REAL root-owned protected directory (what the DIG
  # installer does) and registers a genuine boot-started service AS ROOT, with the §565
  # privileged-target gate FULLY ENABLED — no override anywhere in this job. It then asserts the
  # three properties that actually make a registration survive a reboot, the negative control that
  # the gate refuses an unprivileged target, and the #526/B3 upgrade path: an existing RUNNING
  # user-level node is swept away rather than left fighting for the node's port.
  # ------------------------------------------------------------------------------------------------
  system-scope:
    name: system-scope install/uninstall (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: service-smoke-system

      - name: Build dig-node (release)
        run: cargo build --release --locked --bin dig-node

      # NEGATIVE CONTROL, and it runs FIRST: with no override, an elevated system-scope install from
      # the runner's user-writable checkout MUST be refused, and the refusal must name what failed.
      # Without this, a gate that had quietly stopped firing would look identical to a passing one.
      - name: Gate refuses a system install from a user-writable path
        shell: bash
        run: |
          set -o pipefail
          if sudo -E target/release/dig-node install --scope system --json | tee refused.json; then
            echo "FAIL: a system-scope install from a user-writable checkout was ACCEPTED"
            exit 1
          fi
          grep -q '"ok":false' refused.json
          grep -q 'PERMISSION_DENIED' refused.json
          # The message must name the offending path LEVEL or the program file — an operator cannot
          # act on "somewhere in this path is user-writable".
          grep -Eq 'the path level|the program file itself' refused.json

      # #526/B7: the override is INERT for a genuinely-root system registration. Same command, with
      # the env var set — it must STILL be refused. (An inheritable env var must not be able to turn
      # the gate off for a root boot daemon, and `sudo -E` is exactly how it would arrive.)
      - name: The insecure override cannot disable the gate for a root system install
        shell: bash
        env:
          DIG_NODE_ALLOW_INSECURE_SERVICE_TARGET: "1"
        run: |
          set -o pipefail
          if sudo -E target/release/dig-node install --scope system --json | tee refused-override.json; then
            echo "FAIL: the override disabled the gate for a root system registration"
            exit 1
          fi
          grep -q 'PERMISSION_DENIED' refused-override.json

      # The canonical layout: a root-owned protected directory holding a root-owned 0755 binary —
      # what dig-installer produces (/opt/dig/bin) and what the gate is designed to ACCEPT.
      - name: Stage the binary into a root-owned protected directory
        shell: bash
        run: |
          # The GitHub Linux runner ships /opt group-writable by the `docker` group so the
          # hosted tool cache can be populated — which the #565 gate correctly refuses as a
          # privilege-escalation vector. Restore the stock distribution ownership first, so the
          # step exercises the gate's ACCEPT path rather than the runner's own local weakening.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo chown root:root /opt
            sudo chmod 0755 /opt
          fi
          sudo install -d -o root -g wheel -m 0755 /opt/dig/bin 2>/dev/null || sudo install -d -o root -g root -m 0755 /opt/dig/bin
          sudo install -o root -g wheel -m 0755 target/release/dig-node /opt/dig/bin/dig-node 2>/dev/null || sudo install -o root -g root -m 0755 target/release/dig-node /opt/dig/bin/dig-node
          ls -ld /opt /opt/dig /opt/dig/bin /opt/dig/bin/dig-node

      # #526/B3 — the upgrade population: a RUNNING user-level registration must not survive the
      # elevated install, or both units stay enabled, the running one keeps the port, and the
      # `dig-node start` that dig-installer treats as fatal fails with EADDRINUSE.
      - name: (Linux) pre-existing user-level registration, running
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(whoami)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          target/release/dig-node install --scope user --json | tee user-install.json
          grep -q '"scope":"user"' user-install.json
          target/release/dig-node start --scope user --json || true
          test -f "$HOME/.config/systemd/user/dignetwork-dig-node.service"

      - name: Install at SYSTEM scope, as root, with the gate enabled
        shell: bash
        run: |
          set -o pipefail
          sudo -E /opt/dig/bin/dig-node install --scope system --json | tee system-install.json
          grep -q '"installed":true' system-install.json
          grep -q '"scope":"system"' system-install.json
          grep -q '"program":"/opt/dig/bin/dig-node"' system-install.json

      # The three properties that actually make a registration survive a reboot with no login
      # session. `is-enabled` alone is not enough (it can report "static"/"linked"), and the unit
      # file alone is not enough (a unit file nothing wants never starts) — so all three.
      - name: (Linux) assert a real, boot-enabled system unit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f /etc/systemd/system/dignetwork-dig-node.service
          test "$(systemctl is-enabled dignetwork-dig-node.service)" = "enabled"
          test -L /etc/systemd/system/multi-user.target.wants/dignetwork-dig-node.service

      - name: (macOS) assert a real system LaunchDaemon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo test -f /Library/LaunchDaemons/net.dignetwork.dig-node.plist
          sudo launchctl print system/net.dignetwork.dig-node > launchd-system.txt
          grep -q 'net.dignetwork.dig-node' launchd-system.txt

      - name: (Linux) assert the user-level registration was swept away
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # The unit FILE and its enablement symlink are both gone ...
          test ! -f "$HOME/.config/systemd/user/dignetwork-dig-node.service"
          test ! -L "$HOME/.config/systemd/user/default.target.wants/dignetwork-dig-node.service"
          # ... and the user manager no longer knows the unit.
          ! systemctl --user cat dignetwork-dig-node.service
          # The sweep is REPORTED, never silent.
          grep -q '"user_scope_sweep"' system-install.json
          grep -q "$HOME" system-install.json

      - name: Start the system service + poll for serving
        shell: bash
        run: |
          sudo -E /opt/dig/bin/dig-node start --scope system --json || true
          ok=0
          for _ in $(seq 1 20); do
            if /opt/dig/bin/dig-node status --json | tee system-status.json | grep -q '"serving":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1

      - name: Uninstall at SYSTEM scope + assert every trace is gone
        shell: bash
        run: |
          set -o pipefail
          sudo -E /opt/dig/bin/dig-node uninstall --scope system --json | tee system-uninstall.json
          grep -q '"installed":false' system-uninstall.json
          grep -q '"removed_scopes":\["system"\]' system-uninstall.json
          if [ "${{ runner.os }}" = "macOS" ]; then
            sudo test ! -f /Library/LaunchDaemons/net.dignetwork.dig-node.plist
            ! sudo launchctl print system/net.dignetwork.dig-node
          else
            test ! -f /etc/systemd/system/dignetwork-dig-node.service
            test ! -L /etc/systemd/system/multi-user.target.wants/dignetwork-dig-node.service
            ! systemctl is-enabled dignetwork-dig-node.service
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-smoke-system-${{ matrix.os }}
          path: |
            refused.json
            refused-override.json
            user-install.json
            system-install.json
            system-status.json
            system-uninstall.json
            launchd-system.txt
          if-no-files-found: ignore
