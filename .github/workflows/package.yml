name: Native install packages

# Build the native OS install packages (#503) — the Windows .msi, macOS .pkg, and Ubuntu .deb —
# that ARE the install architecture (the dig-installer just fetches + runs them). Each package
# installs the binary, registers the OS service `net.dignetwork.dig-node`, the chia:// scheme
# handler (→ `dig-node open`), and the restrictive machine-wide state dir (#501).
#
#   * pull_request → BUILD all three (validation only; no publish), so a broken package definition
#     is caught on the PR (release.yml is tag/main-only and does not build packages).
#   * push tag v* → build all three AND attach them to the GitHub Release. The Ubuntu .deb is a
#     release ASSET (apt.dig.net's deploy ingests upstream GitHub release .debs to build the signed
#     apt repo — no push needed; the .deb name + control metadata are apt-correct + stable).
#   * workflow_call → build the packages at a CALLER-SUPPLIED version and leave them as run
#     artifacts for the caller to publish. This is how the NIGHTLY channel gets native packages
#     (dig_ecosystem#618): the beacon installs dig-node by handing a native package to
#     msiexec/installer/dpkg, so a nightly release of bare binaries is one dig-updater's feedsign
#     cannot resolve at all — it fails closed with `no matching release assets` and reddens the
#     signed feed. Calling this workflow keeps the nightly packages built from these SAME
#     definitions rather than a copy that would drift.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package.yml"
      - ".github/actions/**"
  push:
    tags:
      - "v*"
  # The dispatch inputs mirror the `workflow_call` ones below, so a maintainer can rebuild the
  # packages at an ARBITRARY version without publishing anything (the publish job is tag-gated).
  # That is the only way to exercise a nightly-shaped version — `X.Y.Z-nightly.…`, which WiX rejects
  # as a ProductVersion — outside a real release night.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages (blank = the tag name, else Cargo.toml)."
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: >-
          The version to stamp into the packages. Omitted (the PR / `v*` tag paths) means "resolve
          it as before" — from the tag name, else Cargo.toml. Supplied by the nightly channel,
          whose synthesized `X.Y.Z-nightly.YYYYMMDD.<sha>` version exists in no version file.
        type: string
        required: false
      deb_arches:
        description: >-
          A JSON array of `.deb` matrix legs (`runner`/`target`/`dpkg_arch`). Omitted means both
          amd64 and arm64 — the stable default, since apt.dig.net serves both. The nightly channel
          narrows it to amd64: dig-updater's feedsign resolves exactly one Linux platform
          (`linux/x64`), so a nightly arm64 `.deb` would be built every night and resolved by nobody.
        type: string
        required: false
      ref:
        description: >-
          The git ref to check out. Omitted means the ref that triggered the run. The nightly
          channel pins the exact commit its binaries were built from, so the packages and the
          binaries in one release can never come from two different trees.
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # ---- Ubuntu/Debian .deb (amd64 + arm64) -----------------------------------
  #
  # Built inside the SAME pinned old-glibc container as the release binaries
  # (`.github/actions/setup-linux-build`, glibc 2.31 — #1736). This .deb is what apt.dig.net serves,
  # so building it on `ubuntu-latest` made `apt-get install dig-node` produce a binary that would
  # not start on Ubuntu 22.04 LTS, Debian 12 or Amazon Linux 2023 — the same defect as the raw
  # binary, on the path most users actually take.
  #
  # arm64 is built NATIVELY on the free public-repo arm64 runner (#1741): apt's arm64 index
  # previously contained no `dig-node` at all, so every Graviton/Ampere/Pi host was unserved.
  deb:
    name: build .deb (linux-${{ matrix.dpkg_arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:11
    strategy:
      fail-fast: false
      matrix:
        # The legs are data so a caller can narrow them (see the `deb_arches` input). An omitted
        # input is null on every non-`workflow_call` trigger, so the literal below is the single
        # source of truth for the default (amd64 + arm64) that the PR and `v*` tag paths use.
        include: >-
          ${{ fromJSON(inputs.deb_arches || '[
            {"runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","dpkg_arch":"amd64"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","dpkg_arch":"arm64"}
          ]') }}
    steps:
      - name: Bootstrap the container for checkout
        # bullseye-security's pool prunes superseded `.deb` files as point releases land, and the
        # Packages index served by one mirror/edge can briefly disagree with the pool state
        # served by another — so a single apt-get update+install can 404 on whichever package
        # most recently rotated (confirmed on dig-node CI run 33948322114: a DIFFERENT package
        # 404'd on each arch — libexpat1 arm64, libperl5.32 amd64 — ruling out a fixed broken
        # URL). `update` already runs immediately before `install` in this same step, so
        # Docker-layer caching is not the gap; retrying the WHOLE sequence is, because each
        # attempt gets an independent shot at an index+pool pair that agree.
        #
        # Deliberately NO `--fix-missing`: it lets apt UNPACK the packages it could fetch and
        # proceed past the 404 instead of aborting, which left `git`/`perl`/`liberror-perl`
        # half-configured on a real run (dpkg then reports them "already the newest version" on
        # every later attempt, so a subsequent retry never even re-touches the network for the
        # missing file). Without it, a failed fetch aborts before unpacking anything, so every
        # retry starts from a genuinely clean container state.
        run: |
          set -eux
          for attempt in 1 2 3 4 5; do
            if apt-get update -qq && apt-get install -y --no-install-recommends -o Acquire::Retries=3 ca-certificates curl git; then
              exit 0
            fi
            echo "apt bootstrap attempt $attempt/5 failed (stale bullseye-security mirror/edge index vs pool) -- retrying" >&2
            sleep $(( attempt * 5 ))
          done
          echo "::error::apt bootstrap failed after 5 attempts" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Omitted on the PR / tag paths (the triggering ref); pinned by a caller so the packages
          # and that caller's binaries can only ever come from ONE commit.
          ref: ${{ inputs.ref }}
      - name: Trust the checkout (git runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: setup
        uses: ./.github/actions/setup-linux-build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pkg-deb-glibc${{ steps.setup.outputs.glibc-floor }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: pkg-deb-glibc${{ steps.setup.outputs.glibc-floor }}-${{ matrix.target }}-
      - name: Resolve + validate the package version
        id: ver
        shell: bash
        # The caller's version wins; otherwise resolve it exactly as before (the tag name, else
        # Cargo.toml). It arrives through the ENVIRONMENT, never interpolated into this script, and
        # scripts/package-version.sh then whitelist-validates it: the version ends up in a dpkg
        # control file, a `pkgbuild --version` argument and the MSI ProductVersion, on packages that
        # run ELEVATED — so it is checked once, here, rather than escaped at three call sites. The
        # script also emits the NUMERIC ProductVersion the MSI needs, which a nightly version is not.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION:-}"
          if [ -z "$V" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else
              V="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"; fi
          fi
          bash scripts/package-version.sh "$V" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dig-node
      - name: Assert the packaged binary honours the glibc floor
        # Gate the .deb's payload, not just the raw release binary: apt is a separate delivery path
        # and would otherwise be able to regress on its own.
        run: bash scripts/check-glibc-floor.sh "target/${{ matrix.target }}/release/dig-node" "${{ steps.setup.outputs.glibc-floor }}"
      - name: Build .deb
        # The version reaches the dpkg CONTROL file, so it arrives through the environment rather
        # than being interpolated into the command line (it is whitelist-validated upstream too).
        env:
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
        run: bash packaging/linux/build-deb.sh "target/${{ matrix.target }}/release/dig-node" "$FILE_VERSION" "${{ matrix.dpkg_arch }}" dist
      - name: Validate .deb metadata
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          # One artifact per arch — a shared name would make the two matrix legs collide.
          name: dig-node-deb-${{ matrix.dpkg_arch }}
          path: dist/*.deb
          if-no-files-found: error

  # ---- macOS .pkg (universal) ----------------------------------------------
  pkg:
    name: build .pkg (macos-universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Omitted on the PR / tag paths (the triggering ref); pinned by a caller so the packages
          # and that caller's binaries can only ever come from ONE commit.
          ref: ${{ inputs.ref }}
      - name: Install Rust + targets
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-pkg-mac-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-pkg-mac-
      - name: Resolve + validate the package version
        id: ver
        shell: bash
        # The caller's version wins; otherwise resolve it exactly as before (the tag name, else
        # Cargo.toml). It arrives through the ENVIRONMENT, never interpolated into this script, and
        # scripts/package-version.sh then whitelist-validates it: the version ends up in a dpkg
        # control file, a `pkgbuild --version` argument and the MSI ProductVersion, on packages that
        # run ELEVATED — so it is checked once, here, rather than escaped at three call sites. The
        # script also emits the NUMERIC ProductVersion the MSI needs, which a nightly version is not.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION:-}"
          if [ -z "$V" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else
              V="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"; fi
          fi
          bash scripts/package-version.sh "$V" >> "$GITHUB_OUTPUT"
      - name: Build both arches + lipo a universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --bin dig-node
          cargo build --release --locked --target x86_64-apple-darwin --bin dig-node
          mkdir -p dist
          lipo -create -output dist/dig-node \
            target/aarch64-apple-darwin/release/dig-node \
            target/x86_64-apple-darwin/release/dig-node
          lipo -info dist/dig-node
      - name: Build .pkg
        # As for the .deb: the version reaches `pkgbuild --version` through the environment.
        env:
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
        run: bash packaging/macos/build-pkg.sh dist/dig-node "$FILE_VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dig-node-pkg
          path: dist/*.pkg
          if-no-files-found: error

  # ---- Windows .msi ---------------------------------------------------------
  msi:
    name: build .msi (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Omitted on the PR / tag paths (the triggering ref); pinned by a caller so the packages
          # and that caller's binaries can only ever come from ONE commit.
          ref: ${{ inputs.ref }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-pkg-msi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-pkg-msi-
      - name: Resolve + validate the package version
        id: ver
        shell: bash
        # The caller's version wins; otherwise resolve it exactly as before (the tag name, else
        # Cargo.toml). It arrives through the ENVIRONMENT, never interpolated into this script, and
        # scripts/package-version.sh then whitelist-validates it: the version ends up in a dpkg
        # control file, a `pkgbuild --version` argument and the MSI ProductVersion, on packages that
        # run ELEVATED — so it is checked once, here, rather than escaped at three call sites. The
        # script also emits the NUMERIC ProductVersion the MSI needs, which a nightly version is not.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION:-}"
          if [ -z "$V" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else
              V="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"; fi
          fi
          bash scripts/package-version.sh "$V" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        run: cargo build --release --locked --bin dig-node
      - name: Install WiX
        shell: bash
        run: |
          # Pin WiX v5.0.2 — the last release BEFORE the v6+ Open Source Maintenance Fee (OSMF)
          # EULA gate (WIX7015), which cannot be accepted non-interactively in CI. The .wxs uses the
          # v4 schema namespace, which v5 supports. Pin the extension to the SAME version so the
          # WixToolset.Util.wixext major matches the toolset (a mismatched ext major fails to load).
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build .msi
        shell: bash
        # Two DIFFERENT versions, deliberately (dig_ecosystem#618):
        #   * ProductVersion must be numeric `major.minor.build` — WiX rejects a semver prerelease
        #     outright — so it gets the mapped numeric form;
        #   * the FILE NAME keeps the full version, because dig-updater's feedsign recovers a rolling
        #     nightly's version from the asset file name and nothing else.
        # Both arrive through the environment so neither can extend this command line.
        env:
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
          MSI_PRODUCT_VERSION: ${{ steps.ver.outputs.msi_product_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          wix build packaging/windows/dig-node.wxs \
            -ext WixToolset.Util.wixext \
            -arch x64 \
            -d Version="$MSI_PRODUCT_VERSION" \
            -d BinDir="target/release" \
            -o "dist/dig-node-${FILE_VERSION}-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: dig-node-msi
          path: dist/*.msi
          if-no-files-found: error

  # ---- Attach to the GitHub Release (tags only) -----------------------------
  publish:
    name: Attach packages to the release
    needs: [deb, pkg, msi] # `deb` is a matrix; the whole matrix must be green before publishing
    # Tag runs ONLY. A `workflow_call` run (the nightly channel) leaves the packages as run
    # artifacts and lets its own publish job attach them to the rolling pre-release, so this job is
    # correctly skipped there: `github.ref_type` is the CALLER's ref type, which is `branch`.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.pkg' -o -name '*.msi' \) -exec cp {} release/ \;
          ls -la release
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # Do NOT regenerate notes — release.yml (the binary release) owns the notes; this job
          # only appends the native-package assets to the same tag's release.
          generate_release_notes: false
          # Nor does it own `latest` (dig-node#335). This job attaches FOUR of a stable release's
          # fourteen assets; softprops promotes to `latest` by default, so on v0.145.0 this job
          # made a release with no binaries at all the one dig-installer fetched from, five
          # minutes before release.yml attached them. Promotion belongs to release.yml's
          # `promote` job, which runs after the asset guard has confirmed BOTH publishers landed.
          make_latest: "false"
          fail_on_unmatched_files: true
