[package]
name = "dig-node-service"
# Inherits the workspace release version (root [workspace.package].version) so the
# produced `dig-node` binary, the nightly-release.yml tag, and the version-increment gate
# all read ONE version from the root manifest (§2.4/§3.6). Bump it in Cargo.toml
# (root) per SemVer.
version.workspace = true
edition = "2021"
license = "MIT"
description = "The localhost DIG node OS-service binary (`dig-node`): a self-contained, cross-platform Rust binary installable as a Windows/Linux/macOS service. Wraps the canonical `dig-node` node library (the same node the native DIG Browser runs in-process) with an axum HTTP transport + control plane + CLI + OS-service registration, exposing the rpc.dig.net JSON-RPC contract (dig.getContent, dig.getAnchoredRoot, cache.*, control.*) on 127.0.0.1."
repository = "https://github.com/DIG-Network/dig-node"
readme = "../../README.md"
default-run = "dig-node"

# The produced binary keeps the canonical `dig-node` name (the dig-installer + apt
# packaging resolve `dig-node`; the release workflow builds `--bin dig-node`).
[[bin]]
name = "dig-node"
path = "src/main.rs"

# `dign` — a FIRST-CLASS alias binary for `dig-node` (issue #548), mirroring how `digs`
# aliases `digstore` (#434). It shares the SINGLE entrypoint `dig_node_service::run()`
# (see src/bin/dign.rs) so there is no duplicated logic; a build produces BOTH `dig-node`
# and `dign`, and each reflects its own invoked name in --help/--version. The release
# workflow publishes it alongside the primary as `dign-<ver>-<os_arch>[.exe]`.
[[bin]]
name = "dign"
path = "src/bin/dign.rs"

# A tiny stand-in for the REAL `dig-updater` beacon CLI (a separate repo/release, not
# vendored here), so the `updater.*` control-plane tests (#515) exercise a genuine child-
# process spawn — argv, stdout/exit-code parsing — without depending on that binary being
# installed on the test runner. Controlled entirely by env vars (see the fixture's own doc
# comment); never shipped (the release workflows build only `--bin dig-node`, §2.4a).
#
# Deliberately named WITHOUT "update"/"install"/"setup"/"patch": Windows' installer-detection
# heuristic can require elevation to launch (or even just spawn via CreateProcess) an
# unmanifested `.exe` whose name matches those substrings (`ERROR_ELEVATION_REQUIRED`, 740) —
# hit empirically while developing #515 with a `fake_dig_updater` name. The REAL `dig-updater`
# binary name is the beacon repo's own choice and out of scope here; this fixture just avoids
# the trap for OUR test infra.
[[bin]]
name = "fake_beacon_cli"
path = "tests/fixtures/fake_beacon_cli.rs"

# The service shell's own library (transport/control/CLI/meta). Named `dig_node_service`
# so it does not collide with the node library crate, which owns the `dig_node` name.
[lib]
name = "dig_node_service"
path = "src/lib.rs"

# Test-construction seams that must NOT be reachable from a production build. `#[doc(hidden)]` hides a
# symbol from the docs but leaves it fully callable, so it is not access control (#1609) — a real feature
# flag is. Off by default; the crate's own integration tests enable it via dev-dependencies below.
[features]
testkit = []

[dependencies]
# Reads the wallet password for the offline `wallet export-seed` rescue without echoing it
# to the terminal. Used ONLY there; it is removed with that command when node-side wallet
# custody goes. The alternative -- an env var or an echoed stdin line -- would put a spend
# key into shell history, a process listing, or a scrollback buffer.
rpassword = "7"
# The canonical NODE engine library (crate `dig_node_core`) — a first-party sibling
# crate in this workspace (no longer a stale git-pinned digstore alias). It IS the
# rpc.dig.net-compatible node the native DIG Browser runs in-process (`handle_rpc`):
# local-first serve from cached .dig modules, blind ciphertext+proof proxy to the
# upstream on a miss, on-chain anchored-root resolution, chain-watch + subscriptions +
# generation gap-fill, the P2P stack, and the cache.* / control.* surface. This shell
# adds only the HTTP transport, control-plane auth, CLI, and OS-service registration
# around it, and produces the `dig-node` binary (distinct name from the engine lib).
dig-node-core = { path = "../dig-node-core" }

# The PUBLISHED control-plane contract (dig_ecosystem#2376, #2392).
#
# Consumed at RUNTIME, not only in tests, so the coin-id well-formedness rule
# `control.wallet.coinById` enforces IS the contract's own `WalletCoinByIdParams::validated()`
# rather than a second copy of it. Two copies of a published rule agree until they do not, and the
# divergence would surface as a mint that never confirms while the conformance suite -- which pins
# method names and auth posture only -- stayed green.
#
# It also backs the conformance tests, which pin the node's own `CONTROL_METHODS` (still the
# runtime source of truth for the served set) against the published catalog, so a method served
# here but absent from the contract -- or an auth posture the two disagree on -- fails a test
# instead of shipping as drift a consumer discovers.
#
# The requirement is `0.7`, not `0.7.0`, and that MATTERS: that gate ITERATES the contract, so any
# method the pinned version does not declare is invisible to it rather than failing it. Pinned at
# "0.6.0" the suite went green over a `control.wallet.coinById` the contract had never heard of --
# it checked nothing about the very method the change added. A caret range keeps the pin moving
# with the published catalog instead of silently narrowing what CI can see.
dig-node-control-interface = "0.27"

# The deterministic mirror-coin collateral model: the per-epoch requirement, the controller
# multiplier, the small-network handicap, the floor clamp, and the safety-margin arithmetic.
#
# Depended on rather than restated. `required_per_store` is the WHOLE answer -- writing
# `equilibrium x multiplier - handicap` at a call site omits the floor clamp, which is a
# money-path understatement, and a lane has already been refused for putting exactly that
# formula in a SPEC. Every figure this node reports for `control.collateral.requirement`
# comes out of this crate so that a second derivation cannot drift from the consensus one.
dig-mirror-collateral = "0.3"

# The chain half of the same model: `census` counts the collateralised network at a block height
# and hands `dig-mirror-collateral` the three integers its controller consumes (dig-node#400).
# Without it a node could only ever record epoch 1, which is derivable from nothing.
dig-mirror-coin = "0.7"

# The canonical `ChainSource` trait `dig-mirror-coin`'s census is generic over. Declared, not
# implemented: `chia-query` already provides the implementation this node uses
# (`ChiaQueryProvider`), reached through `dig-wallet`'s one shared chain transport. Caret-matched
# to the line `chia-query` and `dig-mirror-coin` compiled against, so all three unify on one crate.
dig-chainsource-interface = "0.3"

# The chia types that reach `mirror::spends`' PUBLIC signatures: `dig_mirror_coin::create` takes
# `Vec<Cat>`, a `PublicKey`, `Coin` fee inputs and a `BigInt` epoch, and `build_create`/
# `build_reclaim` pass them straight through. They were dev-dependencies while the module was
# unwired; a public signature cannot be spelled in a dev-dependency.
#
# The whole chia set moves TOGETHER and every version here is the one `dig-mirror-coin` 0.7 and
# `dig-wallet` compile against. A crate split across two chia lines compiles until something
# crosses a public signature -- which is exactly what these four do -- and then the `Bytes32` the
# builder wants is a different type from the one the caller holds.
chia-bls = "0.36.1"
chia-protocol = "0.36.1"
chia-sdk-driver = { version = "0.36.0", features = ["chip-0035", "action-layer"] }
# The CAT puzzle-hash currying, for deriving the coin a mirror RECLAIM creates before it exists.
# Same chia 0.36 set as the crates around it -- a mirror coin's collateral is $DIG, so the returned
# coin sits at the CAT puzzle hash and never at the bare owner puzzle hash.
chia-puzzle-types = "0.36.1"
# `ToTreeHash`, to re-derive an owner puzzle hash from the key a mirror create is built for, so the
# signer can refuse spends that are not its own wallet's rather than trusting the call site to have
# passed the right key. Part of the same chia set above -- `chia-sdk-driver` already resolves it.
clvm-utils = "0.36.1"
# The epoch term of a mirror hint is a `BigInt`, not a `u64`: the morph is arithmetic over
# 32-byte values and the crate's API says so. Same line as `dig-mirror-coin`'s own.
num-bigint = "0.4.6"

# The OS CSPRNG for all authorization material — the control token, pairing ids/tokens
# (§7), and the relay loop-probe id (`control::fill_random`). Wraps `getrandom(2)` /
# `/dev/urandom` on Unix and `BCryptGenRandom` on Windows, one code path on every
# platform, so a token is NEVER minted from a software (non-CSPRNG) fallback. Pinned to
# the 0.2 line already resolved in the lock (no new major pulled in).
getrandom = "0.2"

# The canonical node<->node JSON-RPC contract crate — the shell's discovery catalogue
# (meta.rs) drift-guards its node-surface method names against this single source of
# truth so the published OpenRPC can never describe a method set that diverges from
# the crate the node implementations share (#1075).
#
# MUST match the engine's major (#1576). The shell and the engine both name methods from this crate, and
# a shell one major behind would drift-guard the discovery catalogue against a method set the engine no
# longer has — the shell would omit `dig.getModuleInfo` / `dig.fetchModuleRange` while the engine served
# them. Two majors in one workspace also duplicates the wire TYPES; pinned by
# `dig-node-core/tests/dependency_tree.rs`.
dig-rpc-protocol = "0.10"

# The Sage-parity wallet engine (crate `dig_wallet`) — the node-custodied wallet DB + dual-transport
# dispatch + seed custody. This shell WIRES it into bring-up (#368): it builds one live
# `WalletBackend` (`sage::service::WalletService`) and serves the Sage method surface on the
# extension-reachable loopback (`POST /{method}`, 9778) + the mTLS 9776 listener, and bridges the
# bidirectional WS wallet+control transport (#369) onto it.
dig-wallet = { path = "../dig-wallet" }

# HTTP stack: the same axum/tokio the node itself uses, so there is one async runtime
# and one server framework across the node and the service shell. `ws` enables
# `axum::extract::ws` for the `GET /ws/status` liveness endpoint (#239).
axum = { version = "0.7", features = ["ws"] }
# TLS-terminating server for the local HTTPS surface (`https://dig.local`, #624). Same
# crate + version dig-wallet already uses for the Sage-parity mTLS listener, so the node
# and service shell share one TLS-serving framework. Feeds it the `rustls::ServerConfig`
# dig-cert builds (its reloadable cert resolver) via `RustlsConfig::from_config`.
axum-server = { version = "0.7", features = ["tls-rustls"] }
# The single source of truth for DIG local-TLS material (#620/#622): the reloadable rustls
# loader + automatic leaf renewal for `https://dig.local`. PINNED to the released tag v0.1.0
# (never `main`) — release-first (§4.1): the crate ships + releases before this consumer.
# NOW A CRATES.IO DEP (dig_ecosystem#901). It was git-tag pinned only because the crate had never
# been published — not for any safety reason. The root cause was that dig-cert's release.yml cut a
# `vX.Y.Z` tag and no job published it, so tags v0.1.0/v0.1.1 existed against an absent crate. Fixed
# in dig-cert#3, which added publish.yml; 0.1.2 is live on crates.io. NC-7 satisfied for this dep.
#
# 0.1.2 IS BYTE-IDENTICAL IN BEHAVIOUR to the v0.1.0 tag this replaced: `git diff v0.1.0 v0.1.2 --
# src/` is EMPTY. The two intervening commits are a test addition and the publish workflow itself.
#
# dig-cert is a leaf crate — no DIG dependencies and no `[patch.crates-io]` section — so the published
# artifact cannot differ from the git-sourced one. That is the property dig-gossip lacks, which is why
# this dep could be repointed and that one is a permanent carve-out (see dig-node-core, #2647).
dig-cert = "0.1.2"
# The serving TLS stack — pinned byte-identical to dig-cert / dig-node-core / dig-dns (0.23,
# default-features off, ring + std + tls12 + logging) so a build installs exactly ONE
# `CryptoProvider` (ring) and never hits the "multiple CryptoProviders" install panic (#622 §7).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Wall-clock `OffsetDateTime::now_utc()` for the daily leaf-renewal maintenance pass (#624).
time = { version = "0.3" }
# `process` backs the async `tokio::process::Command` the `updater` module (#515) spawns the
# `dig-updater` beacon CLI through — a non-blocking child-process wait alongside the axum runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging. The node's engine library (`dig_node_core`) and its transitive
# P2P/TLS stack emit `tracing` events; WITHOUT a subscriber installed here every one is
# silently dropped and a Windows-service run leaves no log at all. `dig-logging` is the
# shared building block (#547) that installs the dual sink — a rolling JSONL file (per-OS
# machine log dir) + human stderr — behind one reloadable level filter, and ships the
# reusable `logs` CLI verbs + the bundle-time redaction engine. Every DIG service binary
# gets logging from HERE rather than hand-rolling a subscriber. Sourced from crates.io (no
# git/path dep) per the ecosystem crates.io policy (#681).
dig-logging = "0.2"
# The logging facade the shell emits through. dig-node-core already depends on `tracing`;
# the service shell now emits its own bring-up/lifecycle events through it, captured by the
# `dig-logging` subscriber installed at the serve entrypoints.
tracing = "0.1"

# CLI + OS-service registration.
clap = { version = "4", features = ["derive"] }
# Cross-platform service manager: Windows SCM, Linux systemd, macOS launchd behind
# one API. User-level install where the platform allows it (per-user service),
# falling back to system-level with documented elevation.
service-manager = "0.7"

# HTTP client for the blind-passthrough fallback: dig_node::handle_rpc resolves the
# node's own method set (dig.getContent / dig.getAnchoredRoot / cache.* / dig.stage /
# the peer surface), returning "method not found" for everything else. This service
# relays those (e.g. dig.getProof, dig.listCapsules) verbatim to the upstream so it
# stays a correct transparent proxy. rustls-tls keeps the binary self-contained (no
# system OpenSSL), same as the node + store crates.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# The canonical DIG URN resolver (#668) — the SAME node-first §5.3 ladder + fail-closed
# verify + branded error assets the extension URN bar uses. `dign open` is a CLIENT
# operation (resolve+open a URN like any consumer), so this client-only dependency lives
# in the SERVICE shell's open-command path ONLY — NEVER in dig-node-core (the server
# engine), where it would be the real dependency cycle. Depends on the PUBLISHED crates.io
# version (no git dep, #681); native feature (reqwest transport + blocking convenience).
dig-urn-resolver = "0.5.3"

# `dig_constants::DIG_NODE_PORT` (§5.3) — the single-sourced canonical default localhost port
# for client→node connections; `config.rs`'s DEFAULT_PORT reads it rather than re-declaring the
# literal. Held in lockstep with dig-node-core's pin (#2072) — 0.11.2, on dig-node's chia 0.36.1
# line (dig_ecosystem#3161) — so the two node crates can never disagree about a canonical value.
dig-constants = "0.13.0"

# Windows Service Control Protocol. service-manager only REGISTERS the service in the
# SCM; the binary the SCM launches must itself speak the service protocol
# (StartServiceCtrlDispatcher → report RUNNING/STOPPED) or the SCM kills it with error
# 1053 ("did not respond in a timely fashion"). The service's hidden `run-service`
# entrypoint uses this to be a real Windows service. (systemd/launchd exec the
# foreground process directly, so they need no equivalent.)
# #526/B1: read the effective uid through `geteuid()` — a syscall, NO process spawn. The privilege
# level now DECIDES the service scope on every service verb, so the previous `id -u` spawn resolved
# a BARE program name through `$PATH` while running as root under `sudo` (whose default
# `secure_path` puts a group-writable `/usr/local/bin` first on Debian, and which macOS does not set
# at all) — a local privilege-escalation vector on the very command the docs tell operators to run.
# Hex + base64 for the control plane: `control.profile.putBody`/`getBody` speak 64-hex ids and
# standard padded base64 bodies, both fixed by dig-node-control-interface.
hex = "0.4"
base64 = "0.22"

# Parsing the operator-set advertised-URL list (dig-node#426). Already resolved in this tree as a
# transitive dependency, so declaring it directly adds no new line; hand-rolling a scheme/host split
# would be a second, weaker URL parser in a place that decides what gets published on chain.
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

# The install-root owner-SID probe (#565 LPE) reads the directory owner through the Win32 security
# API (`GetNamedSecurityInfoW` → owner SID → `ConvertSidToStringSidW`) instead of spawning a
# PowerShell owner query — a bare-name spawn from the (attacker-writable) install root is itself the
# LPE this gate refuses (self_heal.rs). No process is launched.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

# Test-only WS client for the `GET /ws/status` integration tests (#239): connects
# over the wire and reads real frames, mirroring how `tests/server.rs` already
# exercises the HTTP surface with `reqwest` end-to-end rather than in-process.
[dev-dependencies]
# The `never_log` battery (#277) drives the real seed bootstrap against a temp layout so its
# sentinels are the ACTUAL minted phrase and device key rather than invented strings. Already a
# normal dependency above; restated here only so the integration-test crate can name it.
dig-wallet = { path = "../dig-wallet" }
# The watch-list control tests (SPEC §18.6f, dig_ecosystem#2823) build real BLS G1 keys and spell
# them the way a client would. Pinned to the same lines `dig-wallet` builds on so exactly one of
# each resolves.
#
# Named directly rather than through the `chia` umbrella: the umbrella publishes no 0.36.x
# (its series skips 0.32 -> 0.42) and pins the primitives to its own version, so it cannot
# sit on the chia-wallet-sdk ceiling without re-splitting the family (dig_ecosystem#3161).
chia-bls = "0.36.1"
# `mirror_operator_funding.rs` DERIVES its fixture discriminators instead of spelling byte literals:
# CodeQL reads a byte literal reaching a hash as a hard-coded cryptographic salt (dig-node#917, #950),
# and deriving clears the finding at SOURCE rather than justifying it once per call site. Pinned to
# the same 0.36.1 line as every other chia primitive here -- a second line would be a second `Sha256`.
chia-sha2 = "0.36.1"
# The census-runner unit tests implement `ChainSource` over a double, whose method signatures are
# spelled in `chia-protocol` types. The SAME 0.36.1 line `dig-chainsource-interface` and
# `dig-mirror-coin` compile against -- a second line would make the double's `Bytes32` a different
# type from the trait's and the impl would not apply.
chia-protocol = "0.36.1"
# The degraded-source census probe (dig-node#405) builds its mirror coins with genuine CAT spends,
# reusing `dig-mirror-coin`'s own published test support verbatim (`tests/support/mod.rs`). A
# hand-written `CoinRecord` cannot exercise the authentication path the census runs, so the probe
# would assert its property against a fixture that could not exhibit it.
#
# Every version here is the one `dig-mirror-coin` 0.7 itself compiles against, and the whole set
# moves together: the chia ceiling is not one number, and a crate split across two chia lines
# compiles only until something crosses a public signature.
chia-puzzle-types = "0.36.1"
chia-sdk-driver = { version = "0.36.0", features = ["chip-0035", "action-layer"] }
chia-sdk-types = { version = "0.36.0", features = ["chip-0035", "action-layer"] }
clvm-utils = "0.36.1"
num-bigint = "0.4.6"
hex = "0.4"
# The crate's own integration tests need its test-construction seams (the `testkit` feature above).
# Depending on self with the feature on is what keeps those seams available to `tests/` while staying
# absent from any production build of this crate.
dig-node-service = { path = ".", features = ["testkit"] }
# Capturing subscriber for the never-log regression tests (#553 SPEC §7): a `fmt` layer writing
# into an in-memory buffer so a test can assert emitted records never contain secret values.
# Pinned to the SAME 0.3 line `dig-logging` builds on, so exactly one `tracing-subscriber` resolves.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `test-util` unlocks tokio's paused-clock test controls (`#[tokio::test(start_paused = true)]`,
# `tokio::time::advance`) so the self-heal per-child timeout (#693) and the TLS leaf-renewal
# missed-tick behaviour (#660) are tested deterministically without real waits.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# The local plaintext content-serve integration test (#289, `tests/content_serve.rs`) compiles a real
# public `.dig` module and seeds it into the node's cache to exercise the `GET /s/...` surface
# end-to-end over HTTP. It builds the fixture with the SAME digstore stage/compile engine the node
# depends on, pinned to the SAME rev as dig-node-core's store-lib git deps (kept in lockstep).
# Builds the LEGACY `EncryptedSeed` fixture `seed_export_rescue.rs` needs. That layout has no
# writer left in production (nothing here seals a user seed any more), so the only way to
# produce the exact on-disk shape a pre-existing install carries is the crate that wrote it.
# NC-7 exception: the digstore set is git-pinned as one atomic rev — rationale in
# crates/dig-node-core/Cargo.toml (dig_ecosystem#901, blocked on the digstore publishes + #2761).
digstore-chain = { git = "https://github.com/DIG-Network/digstore.git", rev = "161c2a3108cb4bb6c8791e96a26588ec99afb029" }
digstore-stage = { git = "https://github.com/DIG-Network/digstore.git", rev = "161c2a3108cb4bb6c8791e96a26588ec99afb029" }
digstore-core = { git = "https://github.com/DIG-Network/digstore.git", rev = "161c2a3108cb4bb6c8791e96a26588ec99afb029" }
digstore-crypto = { git = "https://github.com/DIG-Network/digstore.git", rev = "161c2a3108cb4bb6c8791e96a26588ec99afb029" }
tempfile = "3"
# The `/s/` origin-derivation test (#1576) drives the REAL router with a FORGED non-loopback
# `ConnectInfo` — the one remote address a loopback-bound test server can never produce — via
# `tower::ServiceExt::oneshot`, and substitutes a recording `dig_node_core::ContentServer` double
# (`AppState::with_content_server`). `async-trait` is needed to implement that boxed trait here;
# both match the versions dig-node-core already resolves, so no extra graph entry appears.
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
# The verification-ledger fail-closed integration test (#307, `tests/content_serve.rs`) crafts a
# self-consistent Merkle proof whose root is NOT the requested (anchored) root and base64-encodes it
# into a mock `dig.getContent` window, so the node's RPC tier verifies-then-fails-closed and records
# the failed entry. `base64` matches dig-node-core's version.
base64 = "0.22"
