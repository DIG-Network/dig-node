[package]
name = "dig-wallet"
version = "0.48.0"
edition = "2021"
license = "GPL-2.0-only"
description = "DIG Browser built-in Chia wallet sidecar: a local axum server (using digstore-chain + chia-wallet-sdk over coinset.org) that serves a Sage-mirroring wallet UI. Native Rust so BLS signing works; the browser opens it at 127.0.0.1."

[lib]
name = "dig_wallet"
path = "src/lib.rs"

[[bin]]
name = "dig-wallet"
path = "src/main.rs"

[dependencies]
# Store-format libs from the digstore repo (git deps, pinned to the same rev as the
# node — bump together). digstore-chain: BIP-39 seed + HD wallet scan + DIG-CAT +
# encrypted seed storage + XCH send. digstore-core: the canonical Capsule
# (storeId:rootHash) identity rendered by /api/stores.
# NC-7 exception: the digstore set is git-pinned as one atomic rev — rationale in
# crates/dig-node-core/Cargo.toml (dig_ecosystem#901, blocked on the digstore publishes + #2761).
digstore-chain = { git = "https://github.com/DIG-Network/digstore.git", rev = "161c2a3108cb4bb6c8791e96a26588ec99afb029" }
digstore-core = { git = "https://github.com/DIG-Network/digstore.git", rev = "161c2a3108cb4bb6c8791e96a26588ec99afb029" }
# The node engine (crate `dig_node_core`) — same workspace (the DIG Browser's in-process
# node + wallet are one host cluster). dig-wallet reads the node's cache surface for the
# wallet UI's "My Node" cache view (cache_cap_bytes / cache_used_bytes / clear_cache / list).
dig-node-core = { path = "../dig-node-core" }
chia-protocol = "0.36.1"
# BIP-39 mnemonic → seed for deriving each custodied wallet's stable id (the Chia BLS
# master public-key FINGERPRINT, #427). Already resolved transitively via digstore-chain;
# declared directly here so `custody` can compute the fingerprint without re-exposing it
# through digstore-chain's `WalletKeys` (a separate, release-first repo).
bip39 = "2"
# The primitive crates this crate used to reach through the `chia` UMBRELLA facade.
#
# The umbrella is GONE, and not by preference: its version series SKIPS the 0.36 line
# entirely (0.32.0 -> 0.42.0, with no 0.36.x published), and every `chia` release pins the
# primitives to its OWN version number. So no `chia` version can hold `chia-protocol`
# 0.36.1, and depending on the umbrella at all would re-split the family this crate just
# unified on the `chia-wallet-sdk` ceiling (dig_ecosystem#3161). Naming the primitives
# directly is the only shape that can sit on the ceiling.
#
# `chia_puzzle_types::nft::NftMetadata` — the on-chain NFT metadata struct we serialize
# into a MintSpec's metadata Program for chia_mintNft / chia_bulkMintNfts; `Memos` and the
# `offer::{NotarizedPayment, Payment}` pair for the offer builder.
chia-puzzle-types = "0.36.1"
# BLS G1/G2 keys + signatures for the wallet signer and the offer aggregate signature.
chia-bls = "0.36.1"
# `tree_hash_from_bytes` for the fallback puzzle-hash path.
clvm-utils = "0.36.1"
# Needed to NAME the SDK spendable `Cat` type when assembling a make-offer's
# MakerFunds, and `SpendContext` to serialize NFT metadata into a Program.
chia-wallet-sdk = { version = "0.36.0", features = ["offer-compression"] }
# CLVM runtime types (NodePtr/Allocator) used by the #216 singleton reconstruction + spend
# builders. Pinned to the same 0.16 the SDK resolves so the NodePtr types unify.
clvmr = "0.16.2"
# Offer building (design A.5): the chia-wallet-sdk action system's `Spends::finish_with_keys`
# takes an ordered `IndexMap<Bytes32, PublicKey>` (owner ph -> signing key), as digstore-chain's
# offer builder does. Same crate the SDK resolves.
indexmap = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
axum = "0.7"
# The PUBLISHED control-plane contract. `BalanceAsset` is re-exported from it rather than
# restated here: the wire spelling of an asset and the asset a read scopes to must be the same
# value, and two enums naming the same tokens agree only until one of them gains a variant.
dig-node-control-interface = "0.30"
# The ecosystem's single definition of a Chia offer id (dig_ecosystem#3140, #283):
# `sha256(spend_bundle.to_bytes())`, the value Chia's `Offer.name()`, Sage and dexie use. This
# crate once derived the id itself from the offered coin set alone, which collided across offers
# over the same coins and silently overwrote rows in the `offers` table.
#
# dig-offers USED to resolve a newer chia stack than this crate, making its `Bytes32` a different
# type; on the 0.36.1 ceiling the two now unify. The isolation argument that made the split
# harmless still holds and is worth keeping: `offer_id` is a pure `&str -> hash` function and we
# consume only its bytes, so nothing depends on the two stacks agreeing.
#
# `sage::offers::offer_id_matches_a_locally_computed_bundle_hash` therefore keeps its value: it
# pins the two implementations to the same HASH rather than trusting they agree, which is a claim
# about the algorithm and not about the version they happen to share today.
dig-offers = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1"

# -- #205 Sage-parity wallet RPC (§18) --------------------------------------------------
# Local wallet database (B.6): SQLite via sqlx, mirroring sage-wallet's relational store.
# `sqlite` bundles libsqlite3-sys (no system SQLite needed); runtime-tokio, no TLS (local
# file). We use the runtime `query()` API (NOT the compile-time `query!` macro) so the
# build needs no live DATABASE_URL; `macros` is only for `#[derive(FromRow)]`.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
# Fallback tier (B.5): coinset.org + non-subscribing peer point-reads, reused AS-IS. From
# crates.io, never a git rev (CLAUDE.md §3.6: consumers depend on the published version).
# 0.6 is REQUIRED, not cosmetic: its `TlsIdentity::Generated` default builds the peer TLS
# identity in memory instead of loading `~/.chia`, which is what lets a node running as a
# Windows service (home = `config\systemprofile`, no `.chia`) construct a chain source at
# all (#2210).
#
# THIS IS NOW THE ONLY chia-query IN THE GRAPH (dig_ecosystem#2227, closed here). dig-node-core
# used to declare `=0.5.1` alongside it, so the lock carried two chia-query lines and two
# dig-chainsource-interface lines. That pin existed solely for a `chia-peer` light client nothing
# ever constructed; removing the dead module removed the pin, and the lock now resolves chia-query
# once. Verify from `Cargo.lock`, not from this comment.
#
# THAT BLOCK IS CLEARED (dig_ecosystem#3161). This used to read "the next move is 0.15 ... BLOCKED
# because digstore-chain is still built against chia 0.26". digstore's own ceiling fix landed, this
# workspace repointed the digstore git rev onto it, and chia types now cross the
# dig-wallet -> dig-node-core boundary on ONE line (0.36.1). So 0.19 needs no shim and none was
# added. Verify from `Cargo.lock`, never from this comment.
chia-query = "0.20.0"
# Diagnostics MUST go through `tracing`, never stderr. dig-node installs the `dig-logging`
# subscriber process-globally (dig-node-service::logging), and a Windows service has no stderr
# to discard to — an `eprintln!` here reaches nobody, which is why a chain-source failure stayed
# invisible across three debugging rounds and 8,000 log lines (#2210, #2216).
tracing = "0.1"
# Dual transport (C.3): mTLS 9776 (Sage byte-parity surface) + plain-HTTP+CORS browser mirror.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tower-http = { version = "0.6", features = ["cors"] }
async-trait = "0.1"
# -- #216 send/spend + singleton reconstruction (§18.9 → §18.8) -------------------------
# Pre-broadcast spend-bundle validation (C.6 fail-closed): validate_spend_bundle runs the
# bundle through chia-consensus before any peer broadcast. Same chia-* 0.36.1 / SDK 0.36.0 line
# as dig-wallet, so Coin/CoinSpend/SpendBundle unify across the crate boundary.
#
# crates.io, NOT the old git rev (#2072). That rev resolved to dig-clvm 0.1.1, which re-exported
# `dig_constants::DIG_MAINNET` from dig-constants **0.1.0** — the version whose DIG L2 genesis
# challenge was still the all-zeros PLACEHOLDER, with every AGG_SIG domain derived from it. Those
# values were finalized in 0.4.0, so the git rev pinned a spend-validation context describing a
# different chain identity than the rest of the node. Signature checking is disabled at that call
# site, so nothing was mis-signed, but the divergence must not be allowed to persist.
dig-clvm = "0.4"
# Spend building (XCH/CAT), coin selection, signing, and NFT/DID/CAT singleton
# reconstruction all reuse the canonical `chia-wallet-sdk` driver constructors
# (SpendContext + StandardLayer + Cat::spend_all + the Nft/Did parsers) already depended on
# above — never hand-rolled CLVM (SYSTEM.md §4.1). NB: `dig-l1-wallet` (the C.2 reuse target
# for spend building) is not yet git-consumable — its `dig-keystore` path dependency does not
# resolve from a git checkout — so its thin SDK-wrapper builder pattern is followed directly
# on chia-wallet-sdk here; making dig-l1-wallet git-consumable is a tracked follow-up (#216).

# -- #205 PR4 (options/actions/themes/network-settings, SyncEvent stream, dig-keystore
# seed migration) -----------------------------------------------------------------------
# At-rest seed custody (design C.2, `seed_store` module): the `opaque` container (Argon2id +
# AES-256-GCM, versioned/magic-tagged/CRC-guarded) replaces the bespoke `digstore_chain::seed`
# on-disk layout for NEW writes; `seed_store::decrypt_seed` still reads old-format files.
# Published on crates.io (not a git dep) — the crate ships its library surface there.
dig-keystore = "0.13"
# The `SyncEvent` stream (design A.9): wraps the `tokio::sync::broadcast` receiver as a
# `Stream` for the SSE `GET /events` handler (`sage::transport`). `tokio-stream` supplies the
# `BroadcastStream` wrapper + `StreamExt` combinators; `futures-core` supplies the `Stream`
# trait itself (axum's `Sse<S>` is generic over it) — both tiny, no extra runtime.
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"

# -- #431/#432 node-managed unlock auth (§18.24) ----------------------------------------
# TOTP 2FA (RFC-6238) as an optional required second factor on the password unlock. Pure
# Rust (no OpenSSL): `otpauth` gives the `otpauth://` provisioning URI, `gen_secret` the
# random secret generator. The secret is sealed at rest under the wallet password via the
# `dig-keystore` `opaque` container (§18.18) — never stored in plaintext, never logged.
# (WebAuthn/passkey — SPEC §18.24 — is enrolled behind the same interface; its real
# `webauthn-rs` ceremony is finalized with the extension origin in the follow-up, since
# webauthn-rs pulls OpenSSL and the RP/origin is defined by the paired extension #433.)
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
# Cryptographically-secure randomness for quorum peer selection (dig_ecosystem#2568). The OS
# CSPRNG DIRECTLY (`/dev/urandom` / `getrandom(2)` / `BCryptGenRandom`) rather than a seeded
# userspace generator: random selection IS the trust model's defence, so the source must be one
# an attacker cannot predict, observe or steer (dig_ecosystem#2549). Deliberately not `rand` --
# `thread_rng` would work but adds a seeded layer whose provenance a reader has to go and check.
getrandom = "0.2"
chia-traits = "0.36.1"

# -- #277 unattended wallet bootstrap (`autoseed`) --------------------------------------
# The `created_at` stamp on the wallet's origin sidecar, as RFC 3339. Already in the
# workspace lock via dig-node-service, so this adds a feature rather than a dependency.
time = { version = "0.3", features = ["formatting"] }

# The auto-created seed and its device key are written with an EXPLICIT owner-only DACL
# rather than whatever `%LOCALAPPDATA%` happens to inherit: that ACL is per-user by
# convention, not by guarantee, a Unix 0600 does not translate onto it, and an inherited
# ACL widened later by an administrator or a profile policy would never re-run this code.
# Same 0.61 line (and the same GetSecurityDescriptor/SE_FILE_OBJECT surface) that
# dig-node-service's install-root owner probe already builds on, so one resolves.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# Recompute the canonical offer id with THIS crate's chia stack, so the parity test can pin
# dig-offers' (newer) stack and ours to the same value rather than trusting they agree (#283).
# Pinned to the 0.36.1 line the local chia-protocol resolves.
chia-sha2 = "0.36.1"
# `start_paused` — a virtual clock, so the peer-request deadline (#2851) is asserted to EXIST
# without a test that actually waits sixty seconds for it.
tokio = { version = "1", features = ["test-util"] }
# Capture emitted `tracing` events in-process so a test can assert a diagnostic actually
# reaches the log sink, rather than trusting that it was written at all (#2210).
# The SAME 0.3 line dig-logging builds on, so one tracing-subscriber resolves.
tracing-subscriber = "0.3"
# K1Pair — real secp256k1 test key pairs for the vault config / K1 pubkey parse tests.
chia-sdk-test = { version = "0.36.0", features = ["peer-simulator"] }
# Drive the axum Router transport-independently (oneshot) and read response bodies in
# the conformance + transport-parity tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
