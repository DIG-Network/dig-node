[package]
name = "dig-node-core"
# The engine library's OWN version, independent of the released binary's (`[workspace.package].version`
# in the root manifest, which only dig-node-service tracks). It moves when this crate's PUBLIC surface
# moves: 0.24.0 acknowledges that the surface now exposes dig-nat 0.14 / dig-dht 0.8 types, a
# compatibility-relevant change even though the crate is consumed in-workspace and is not published to
# crates.io. Holding it at 0.23.0 would have overstated stability to anyone reading the manifest for
# what the exported types are (dig_ecosystem#1785c). 0.26.0 does the same for the 0.15 line: the
# exported dig-nat / dig-dht types rotate identity again, and `DhtError` — reachable through this
# crate's dig-dht re-exports — now carries `SafeText` instead of `String` (dig_ecosystem#1674/#1675).
# 0.27.0 adds the pure `relevance` module (CacheTier / relevance() / evict_key / should_displace) —
# a new, backwards-compatible public export (dig_ecosystem#1986), hence a MINOR bump.
# 0.28.0 adds the pure `tier0_selector` module (Candidate / select_within_budget / tier0_budget_bytes /
# should_displace_tier0) built on 0.27's relevance module — a new, backwards-compatible public export
# (dig_ecosystem#1988), hence another MINOR bump.
# 0.31.0 adds cache observability to `cache.stats` (§7.10e) — `refetch_count` + per-tier `tiers`
# occupancy fields, and makes `InboundDemand::entry_count` a real (no-longer-`#[cfg(test)]`) public
# API — a new, backwards-compatible surface (dig_ecosystem#1991), hence a MINOR bump.
# 0.47.0 adopts dig-gossip 0.25.0 and splits the announce seams by ORIGIN: `ProfileTransport` gains a
# required `announce_root_local` and `MeltBroadcast` a required `broadcast_local`, so a locally
# originated announce takes dig-gossip's dedup-exempt path and a re-announce of an unchanged root is
# no longer suppressed forever (dig_ecosystem#3061). Adding a required trait method is BREAKING for an
# out-of-workspace implementor; this crate is consumed in-workspace only and is pre-1.0, so it is a
# MINOR bump under SemVer's 0.x rule -- recorded here rather than letting the number imply the trait
# surface held still.
version = "0.47.0"
edition = "2021"
license = "GPL-2.0-only"
description = "The canonical DIG node ENGINE library (crate `dig_node_core`): the JSON-RPC dispatch (`handle_rpc`, the same contract as rpc.dig.net), local-first content serve/fetch/redirect from LOCAL .dig store modules (via digstore_host::serve_blind), chain-anchored-root resolution, chain-watch + subscriptions + generation gap-fill, the LRU cache, and the full P2P stack. Shared UNCHANGED by both host shells: the `dig-node` OS-service binary (dig-node-service) and the DIG Browser's in-process cdylib (dig-runtime). Native Rust so the compiled-module serve path works."

[lib]
name = "dig_node_core"
path = "src/lib.rs"

[dependencies]
# Bounds the whole-module descriptor memo (`seams/dig_peer/module_serve.rs`, #1615/G2): a per-process
# cache of `dig.getModuleInfo` answers keyed by (store, root), capped so a long-running node cannot
# accumulate one entry per module it has EVER described (each entry is tens of KB — up to 512
# chunk_hashes + chunk_lens). Already a transitive dependency (pulled in via the workspace's other
# crates); promoted to a direct one now that this crate uses it itself.
lru = "0.12"
# The `.dig` STORE-FORMAT LIBRARY crates. These live in the digstore repo (the store
# CLI + format/read libraries) and are consumed here as GIT dependencies: the node
# depends on the store libs, NEVER the reverse (digstore is only ever an RPC client of
# a node). Pinned to a single digstore rev so the whole store-format surface the node
# reads/verifies/decrypts against is one coherent version. Bump all seven together.
#
# digstore-host     — instantiate a compiled module + `serve_blind` (ciphertext + proof).
# digstore-core     — wire types (ContentResponse), codec, Bytes32/48, the PublicManifest
#                     type + `datasection::read_public_manifest` (#176 Phase C).
# digstore-remote   — the §21 remote client + persistent identity signer (§21.9).
# digstore-chain    — CHIP-0035 singleton lineage walk (chain-anchored root).
# digstore-stage    — the shared stage→compile engine for the `dig.stage` RPC (turn a
#                     folder into a capsule in-process, #95 Pass C). Its build script
#                     embeds the guest wasm (BINDING contract D6) via the DIGSTORE_GUEST_WASM
#                     override this repo sets in .cargo/config.toml (see vendor/).
# digstore-crypto   — read-path crypto primitives.
# digstore-compiler — `extract_data_section_blob` (#176 Phase C): pulls the embedded DIGS
#                     data-section blob out of a compiled `.dig` module's wasm binary so
#                     `dig.getManifest` can read section 13 (the PublicManifest) WITHOUT a
#                     wasmtime instantiation (the manifest is PUBLIC, unencrypted data — no
#                     `serve_blind` decrypt needed). Already a transitive dependency via
#                     digstore-stage; pinned directly at the SAME rev so its public API is
#                     usable here too.
#
# Bumped to a rev past digstore's "Add normalized public manifest to the .dig format"
# commit (08f5d39) so `PublicManifest`/`read_public_manifest`/`extract_data_section_blob`
# exist.
#
# Bumped again to 4c34f0be (digstore v0.19.2, fix #1473) to adopt the HARDENED,
# unforgeable `digstore_chain::singleton::verify_pinned_root`. The prior rev (d5e52fb)
# anchored store identity on the attacker-controllable curried `SingletonStruct.launcher_id`,
# so a forged singleton currying `launcher_id == store_id` (hinted to store_id) could pass as
# chain-verified. 4c34f0be anchors identity on the UNFORGEABLE launcher coin (`coin_id ==
# store_id`) via a bounded backward `parent_coin_info` walk, making the read-root anti-rollback
# check (#747/#841/#852-node) SOUND. The public signature is unchanged (a pure rev bump). Bump
# all seven together.
digstore-host = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
digstore-core = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
digstore-remote = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
digstore-chain = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
digstore-stage = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
digstore-crypto = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
digstore-compiler = { git = "https://github.com/DIG-Network/digstore.git", rev = "4c34f0be" }
chia-protocol = "0.26"
# The `Streamable` to_bytes/from_bytes trait, used to serialize the chat `ChatMessage` payload before
# the dig-message seal. Same 0.26 as chia-protocol so the byte layout agrees across the workspace.
chia-traits = "0.26"
# -- Seam 1: Chia light-client CONFIRMATION/PEAK observability (#1314) --------------------------------
# `chia-peer` is a subscribing Chia wallet-protocol light client (a thin driver over chia-wallet-sdk
# 0.30 / chia-protocol 0.26): it tracks the peak + coin/puzzle-hash confirmations for the coins the
# node SUBSCRIBES to (DataStore singletons, collateral, treasury/tip) and submits spend bundles. Its
# read side is a `dig-chainsource-interface` `ChainSourceProvider` the node registers into
# `chia-query`'s aggregating `ProviderRegistry` at priority 20 (DI). This is DISTINCT from the
# content-root path: DataStore content-root resolution STAYS on the coinset `sync_datastore` walk
# (`CoinsetResolver`, seam 1's `AnchoredRootResolver`), UNCHANGED. The light client deliberately
# returns `Unsupported` for singleton-lineage + block-timestamp reads, which fall through to
# chia-query's coinset provider. All three crates share chia-protocol 0.26 + dig-chainsource-interface
# 0.1, so their types unify with the workspace (crates.io, never git).
chia-peer = "0.1"
dig-chainsource-interface = "0.1"
# PINNED EXACTLY at 0.5.1 (#2210) — an `=` requirement, not a caret, and that is load-bearing.
# chia-query 0.5.2 moved to `dig-chainsource-interface` 0.2, while `chia-peer` 0.1.3 (the
# light-client seam registered into the `ProviderRegistry` below) is still built against 0.1.
# The two `ChainSourceProvider` traits then fail to unify and `registry.register` stops
# compiling, so a caret `0.5` silently breaks this crate the moment the lock refreshes.
# 0.5.1 is the last version whose `dig-chainsource-interface` agrees with chia-peer's.
# Unpinning (to 0.6, alongside dig-wallet) needs a `chia-peer` release built against
# dig-chainsource-interface 0.2 FIRST (release-first, §4.1) — a separate repo, tracked
# separately. dig-wallet is on chia-query 0.6 meanwhile: it does not exchange `chia_query`
# types across this crate boundary, so the two lines coexist without unifying.
chia-query = "=0.5.1"
# The ecosystem's canonical address-family / IPv6-first primitive (CLAUDE.md §5.2). The advertise
# path keys + orders candidate addresses via `dig_ip::Family` and aggregates them source-tagged +
# de-duplicated via `dig_ip::PeerCandidates` — never a hand-rolled family sort (epic #1020, #1032).
# A leaf crate (no transitive DIG deps), so the crates.io release is used directly.
dig-ip = "0.1"
# The canonical dig-app ⇄ dig-node IPC session/signing contract (engine role-half + wire types +
# domain builders + frame bounds). SSOT shared with dig-app so the two halves can never drift (#1080).
dig-ipc-protocol = "0.2"
# On-chain DID resolution (WU3, #778): the honest chain-authenticated read path the production
# DidSigningKeyResolver delegates to. Not on crates.io — consumed via git tag (same pattern as dig-app).
dig-identity = { git = "https://github.com/DIG-Network/dig-identity", tag = "v0.4.0" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
# Object-safe async trait for the injectable anchored-root resolver (the
# mandatory read-path chain pin, #127): production walks coinset, tests inject a
# deterministic resolver.
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The canonical node<->node JSON-RPC contract: the Method catalogue (wire names +
# per-method tier) and the mTLS peer-reachability allowlist. dig-node-core reads its
# method names + the peer allowlist from HERE (never hand-rolled) so the contract
# cannot drift from the other node implementation or the discovery document (#1075).
dig-rpc-protocol = "0.6"
# The directed-message base protocol (epic #793/#796): the e2e seal/open pipeline + the typed envelope
# the chat subsystem seals into. dig-node is the TRANSPORT — it seals an app-supplied opaque DIGCHAT1
# envelope to the recipient's 0x0010 BLS identity key and dig-gossip directed-sends the sealed bytes.
dig-message = "0.5"
# The chat message-TYPE layer: the five chat payloads on dig-message's dig-chat band + the registry
# wiring. A crypto-free, content-blind type layer — the DIGCHAT1 seal is carried as opaque bytes.
dig-chat-protocol = { path = "../dig-chat-protocol", version = "0.1" }
base64 = "0.22"
hex = "0.4"
# The whole-module pull's one content-addressing primitive (#1576): the module descriptor's per-chunk +
# whole-blob hashes on the SERVE side, and the pre-announce re-hash that proves the artifact about to be
# cached + announced is byte-identical to the one the anchor gate admitted. Production, not test-only —
# this hash is what stands between a promoted artifact and a promoted-but-unverified one.
sha2 = "0.10"
filetime = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fs4 = { version = "1.1.0", features = ["sync"] }
directories = "6.0.0"
# OS CSPRNG for the per-stage content-authoring BLS key (#95 Pass C dig.stage).
getrandom = "0.2"
# -- L7 DIG Node peer network (PHASE-2b, #162) -------------------------------------------------------
# The NAT-traversal + connected-peer-pool layer. The bespoke in-node relay client (formerly relay.rs)
# is RETIRED: the relay connection now lives inside dig-nat (the `connect()` ladder's last-resort tier
# + the persistent reservation) and dig-gossip (the introducer-backed connected peer pool). dig-node
# consumes both to auto-discover peers via relay.dig.net, maintain a pool, and serve/issue the L7 peer
# RPC over mTLS (peer_id = SHA256(TLS SPKI DER)).
#
# Sourcing (#1280/#1393/#1494 crates.io cascade): dig-nat 0.11 is on crates.io — the whole peer stack
# (dig-gossip 0.15.0, dig-dht 0.5.1, dig-download 0.7.1, dig-peer-selector 0.5.2) now depends on dig-nat
# ">=0.10, <0.12" from crates.io, so consuming it here as a plain crates.io version unifies the ENTIRE
# graph on ONE dig-nat 0.11 instance (the old bare-git unification patch is retired). 0.11 adds the
# relayed RESPONDER path — `RelayStatus::enable_accept` surfaces an introduced circuit as a
# `RelayTunnel`, and `RelayAcceptor` runs the mTLS SERVER half over it (#1536, Leg B) — on top of
# 0.10's SPKI-pinned dialer (#1422) and the STUN happy-eyeballs reflexive discovery, and auto-composes
# the FULL NAT ladder via `connect_with_runtime` + `NatRuntime`, taking a CA-signed NodeCert.
# 0.11.2 is REQUIRED (#1586): before it, `RangeFrame::bytes` was read with `serde_bytes`, which over
# the JSON frame wire takes the served base64 string as its literal characters — so every
# `dig.fetchRange` window arrived as its own base64 text, the reassembler rejected the frame, and the
# read leg aborted before reading a byte. 0.11.2 reads/writes `bytes` as base64 (the canonical
# `dig_rpc_protocol::types::RangeFrame` wire the node's own serve path emits).
# dig-nat 0.13 is the release that introduced the FALLIBLE, payload-capped `RangeFrame::encode` plus
# the paged-prologue sender API (`with_identity` carrying `chunk_count`, `with_chunk_lens_page` /
# `chunk_lens_offset`, `with_chunk_index`, `RangeRequest::skip_layout`). Everything 0.14 adds is the
# RECEIVER (`ChunkLensAssembler`) plus the `split_chunk_lens_pages` helper, so 0.13 carries the whole
# serve-side fix for #1640/#1668.
#
# The dig-nat MAJOR must match the whole peer stack's, and it moves as ONE step (#1771). This crate
# builds its own `dig_nat` `NodeCert` / `NatConfig` / `NatRuntime` / `RelayStatus` / `TraversalKind`
# values and passes them INTO dig-download, dig-gossip and dig-peer-selector, so a second dig-nat
# instance does not merely bloat the tree -- those calls stop typechecking (verified: E0308 `expected
# dig_nat::relay::RelayStatus, found dig_nat::RelayStatus`). So dig-nat cannot be bumped alone, and
# dig-gossip/dig-dht/dig-download/dig-peer/dig-peer-selector cannot be bumped past it: the 0.15 line
# (dig-gossip 0.18, dig-dht 0.9, dig-download 0.13, dig-peer 0.8, dig-peer-selector 0.8) is a single
# atomic cascade, which #1674/#1675 completed by publishing every member. `tests/dependency_tree.rs`
# asserts the single-instance invariant against the resolved LOCK so a partial cascade cannot quietly
# reintroduce the duplicate.
#
# The 0.15 line carries the SafeText peer-text cascade (#1674/#1675): error text of remote origin is
# held as `dig_nat::SafeText` rather than `String`, so a hostile peer's control characters cannot forge
# a line in an operator's log. On a partial bump the failure is now LOUDER than the RelayStatus mismatch
# above -- `SafeText` crosses dig-dht's AND dig-peer's public error surfaces, so two dig-nat versions is
# an outright compile error on those seams rather than merely two mTLS stacks. See
# `seams/dig_peer/dht.rs::stage_failed` for this crate's side of the adoption.
dig-nat = "0.18"
# dig-gossip is the ONE peer-stack exception: not yet published to crates.io (its publish is guarded
# pending dig-peer-protocol, #681), so it stays a git dependency PINNED to a release commit — here
# v0.17.12 (rev 3e352d91).
#
# v0.17.12 is REQUIRED, not merely current (#1771): it carries all THREE duplicate-connection fixes,
# and until it landed here the node's pool refused connections that would have worked. Every pool-add
# path now supersedes a stale slot for an already-authenticated `peer_id` instead of refusing the newer
# session — inbound (#1691), `connect_to` (#1703), and `adopt_nat_connection` (#1762), the last being
# the path EVERY dig-nat connection is adopted through, where a dead relay circuit's leftover slot
# refused the direct dial while the peer reported zero connections. `DuplicateConnection` still exists
# as an error variant but is no longer raised on those paths. Consequence for this crate: `PeerAdded` is
# REPUBLISHED on a supersede, so every consumer of it must be keyed by `peer_id` and idempotent (the DHT
# routing feed, the selector registry, and the download-side connected pool all are — see
# `download.rs::on_pool_event`), and `GossipStats::total_connections` is a LIFETIME counter that a
# supersede increments, so it must never be read as a count of unique peers (this crate reads
# `connected_peers` / `pool_stats().connected`, which are the live keyed-map sizes).
#
# Also on 0.17: the outbound /16+AS diversity caps (#1710/#1716) apply to the adoption path, so a
# test fixture adopting two peers must place them in DIFFERENT /16 groups.
# Pulled rustls-only (no native-tls) -- note `--all-features` is NOT a runnable configuration for
# dig-gossip: with both `ring` and `aws-lc-rs` reachable rustls cannot pick a provider. Its dig-nat/dig-tls/dig-constants come from crates.io (same versions as here), so the
# graph still unifies to ONE of each. The vendored chia-protocol/chia-sdk-client forks it path-patches
# are re-declared at this SAME rev in the workspace `[patch.crates-io]` (a git dep's own patches do not
# apply transitively — the #1529 3-rev lockstep: this dep rev + the two patch revs move together).
dig-gossip = { git = "https://github.com/DIG-Network/dig-gossip", rev = "51054a4132ee51b7cee2cba1768b75ade5360f9c", default-features = false, features = ["rustls", "relay"] }
# The canonical DIG network id (genesis challenge) for the gossip handshake / introducer scope.
#
# 0.9 is the TIP OF DIG-NODE'S CHIA LINE, and that — not 0.10 — is the correct target here (#2072).
# dig-constants 0.10.0 moved to chia-protocol 0.36.1 / chia-wallet-sdk 0.34, while this workspace
# builds against 0.26 / 0.30 including the chia-protocol fork dig-gossip vendors via
# `[patch.crates-io]` above. Depending on 0.10 links a SECOND chia_protocol and every `Bytes32` this
# crate reads off `DIG_MAINNET` stops unifying with the rest of the workspace. Being current on
# dig-constants is therefore downstream of the chia 0.36 migration, not a version-string edit.
#
# Values are identical from 0.4.0 through 0.10.0 — the L2 genesis challenge and its six AGG_SIG
# domains were finalized in 0.4.0 and have not moved since — so this bump is value-neutral and buys
# the additive surface (DIG_ASSET_ID, the treasury hash/address, `dig.local`, `rpc.dig.net`).
#
# The graph still carries 0.4.0/0.5.1/0.8.0 because upstream crates hold them down through their
# PUBLISHED ranges (dig-gossip `>=0.2, <0.5`, dig-nat `>=0.4, <0.6`, dig-download `^0.8`), which a
# consumer cannot edit. Collapsing to a single copy needs each of those to release against 0.9 —
# the release-first cascade on #2072. Do NOT pin this BACK to widen a window: the fix is upstream
# moving forward, never dig-node drifting backward.
dig-constants = "0.9"
# -- Portable profile body format (DPB) — epic #3008 W6 -----------------------------------------------
#
# `default-features = false` deliberately: the default `chia` feature pulls dig-did/dig-store/
# chia-protocol 0.36.1, which is a DIFFERENT chia line from the 0.26 this workspace builds against, so
# the default surface would put a SECOND chia-protocol into the always-running service. Without the
# feature the crate is a pure BYTE CORE (`dig-smt + sha2 + thiserror`) exposing exactly what the node
# needs: the DPB container, `AnchoredRoot` and `VerifiedBody`.
#
# Consequence to keep in mind: `dig_social_profile::resolve` is NOT available here. The node resolves
# a store's on-chain root through its OWN `AnchoredRootResolver` (the coinset lineage walk), which is
# the same authority, reached by the node's existing seam.
dig-social-profile = { version = "0.6", default-features = false }
# -- L7 content-location DHT (PHASE-B, #163) ---------------------------------------------------------
# The Kademlia DHT that maps DIG content (store / capsule / root / resource) to the peer_ids holding
# it. The node LOCATES content it lacks via `find_providers`, and keeps its OWN held-inventory provider
# records CURRENT in the DHT (`announce_provider` / `withdraw_provider` / `republish`). It rides the
# SAME dig-nat mTLS transport as the rest of the peer network via a `DhtTransport` adapter (`dht.rs`).
#
# Sourcing: the crates.io release (NC-7: prefer the published version over bare-git now that dig-dht
# is on crates.io). dig-download + dig-peer-selector below ALSO resolve dig-dht from crates.io "^0.5",
# so cargo unifies to ONE dig-dht instance — dig-dht's `PeerId` / `Contact` / `DhtTransport` share the
# exact types `dig_nat::connect` returns. dig-dht 0.5 deps dig-nat "^0.10" (crates.io), the SAME
# dig-nat "0.10" this crate pins, so the whole graph shares ONE dig-nat 0.10 instance.
dig-dht = "0.11.1"
# -- L7 Peer Exchange (PEX, #166) --------------------------------------------------------------------
# The node<->node peer-sharing protocol: over each established mTLS peer connection, a dedicated PEX
# logical stream exchanges delta-based first-hand known-peer sets (handshake -> snapshot -> deltas),
# feeding discovered peers into the pool as dial candidates (hints, verified by dialing) and formalizing
# what the ad-hoc `dig.getPeers` polling did. dig-pex ships a transport-agnostic sans-IO `PexEngine`
# this crate embeds; `pex.rs` is the dig-nat mux I/O adapter (SPEC §10.1, Appendix A).
#
# Sourcing: bare git form (no `rev`, like dig-nat/dig-dht) so cargo unifies any shared transitive deps
# to ONE copy across the graph; resolved to the tracked rev via the lockfile. dig-pex keeps a minimal
# dependency surface (serde/serde_json/tokio/rand — it mirrors the address shape rather than importing
# the transport crates), so there is no cross-crate type-unification concern here.
dig-pex = "0.1"
# -- Multi-source content fetch (#164) + redirect-on-miss (#165) --------------------------------------
# The node-side download orchestrator: locate holders via dig-dht `find_providers`, confirm with
# `dig.getAvailability`, fan byte ranges across MULTIPLE providers simultaneously (`dig.fetchRange`
# over dig-nat), verify each range + the whole resource against the chain-anchored root, and
# reassemble — with pause/resume + `.download.tmp` GC. dig-node wires the real seams per the crate's
# implementers' note (see `download.rs`): DhtProviderLocator over our DhtService, NatRangeTransport
# over our mTLS identity, MerkleVerifier bound to the digstore proof format, FileSink/FileStateStore
# under the node's cache dir.
#
# Sourcing: the crates.io release (NC-7), matching dig-dht above. dig-download 0.6 deps dig-dht "^0.5" +
# dig-nat "^0.10" + dig-tls "^0.3" from crates.io, so cargo unifies its dig-dht + dig-nat + dig-tls with
# ours — ONE crate instance each across the graph (its re-exported `ContentId`/`ProviderRecord` ARE our
# dig-dht types). 0.6 keeps the injectable `SourceSelector` seam (dig-node implements it over
# dig-peer-selector, see `seams/dig_peer/selector_adapter.rs`), records range outcomes internally, and the
# fetch leg composes the FULL NAT ladder from an injected shared `NatRuntime` (`NatRangeTransport::new_with_runtime`).
#
# 0.8.1 adds the `ModuleDownloader` — the whole-`.dig`-module peer pull that turns a node which READ a
# resource into a complete resharer of the capsule (#1576, the reshare leg of the MVP flywheel). Its two
# seams are supplied here: `seams/dig_peer/module_transport.rs` (`NatModuleTransport`) and
# `seams/dig_peer/module_anchor.rs` (`ChainAnchoredModuleVerifier`). NOTE the `testkit` feature is
# deliberately NOT enabled: it is what makes the fail-OPEN `AcceptAnyModuleAnchor` nameable, and this
# crate's anchor gate is the reshare path's ONLY root of trust.
dig-download = "0.17"
# -- The shared peer client (#1283/#1576) -------------------------------------------------------------
# `DigPeer` — the ONE DIG Network peer client: peer_id-pinned mTLS over the full NAT ladder plus typed
# RPC. Depended on DIRECTLY (not only transitively through dig-download) because dig-node supplies the
# `ModuleTransport` half of dig-download's module pull, which speaks `dig.getModuleInfo` /
# `dig.fetchModuleRange` — the two client methods dig-peer 0.5 added for exactly this leg.
#
# 0.5 is REQUIRED, not merely current: dig-peer 0.4 pulled dig-rpc-protocol 0.3, so a tree containing
# both it and dig-download's dig-rpc-protocol 0.5 carried TWO `ModuleInfo` types either side of the
# module pull's trust boundary — on the fields that drive the whole pull plan. dig-download 0.8.1 is on
# dig-peer 0.5 too, so exactly ONE dig-rpc-protocol + ONE dig-peer resolve here (asserted by
# `crates/dig-node-core/tests/dependency_tree.rs`).
dig-peer = "0.9"
# -- Self-optimizing peer selection (#178) ------------------------------------------------------------
# The decision + learning layer between dig-dht discovery and dig-download execution: it ranks the
# providers `find_providers` returns (learning throughput/rtt/reliability + a per-class saturation
# point + an adaptive relayed penalty from the REAL measured outcome of every range) and hands
# dig-download the ranked subset + per-peer concurrency, instead of dig-download picking sources
# blindly. Every completed/failed range streams back via `record_outcome` in real time, and a dropped
# source drives a `rebalance`. dig-node bridges dig-download's `SourceSelector` seam to this crate via
# `seams/dig_peer/selector_adapter.rs` (the @30↔@30 composition-root bridge — dig-download does NOT
# depend on dig-peer-selector; dig-node, one level up, wires them together).
#
# Sourcing: the crates.io release (NC-7), matching dig-dht/dig-download above. It deps dig-dht "^0.5" +
# dig-nat "^0.10" from crates.io, so cargo unifies the selector's `dig-nat` + `dig-dht` with ours — ONE
# crate instance each (its re-used `PeerId`/`ContentId`/`ProviderRecord`/`CandidateAddr` ARE our
# dig-nat/dig-dht types). The selector mirrors `dig_gossip::PoolEvent` LOCALLY (it does not depend on
# dig-gossip, which lags as a git dep), so the node maps `dig_gossip::PoolEvent` → the selector's local
# `PoolEvent` 1:1 (see `download.rs::pool_event_to_selector`).
dig-peer-selector = "0.9"
# The canonical DIG mTLS certificate crate (L00, crates.io). The node's PERSISTENT machine identity
# is a CA-signed `dig_tls::NodeCert` minted from the node's own BLS identity key and persisted 0600 in
# the data dir (#908 identity boundary: this is the MACHINE key, never a user key). Replaces the
# legacy self-signed `rcgen` cert as the node dials/serves over the dig-nat CA-signed mTLS model
# (#1280). `peer_id = SHA256(SPKI DER)` is stable across restarts. dig-tls re-exports chia-bls's
# `SecretKey`, unifying with this crate's chia-bls 0.26.
dig-tls = "0.3"
# The mTLS peer-RPC LISTENER (server side): present the node cert + REQUIRE a client cert (peer_id
# enforced). rustls/tokio-rustls with ring only (no OpenSSL/aws-lc for OUR usage), matching dig-nat.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# IPv6-first, IPv4-fallback (ecosystem HARD RULE): bind the peer-RPC listener on the IPv6 unspecified
# address `[::]` as a DUAL-STACK socket (IPV6_V6ONLY cleared) so ONE socket serves both native IPv6
# and IPv4-mapped peers. Mirrors dig-relay's `net.rs` / dig-gossip's own dual-stack bind.
socket2 = "0.5"
# -- Engine-side identity session (NODE-1, #910) -----------------------------------------------------
# The engine is IDENTITY-AGNOSTIC: it holds NO user signing key. `control.session.attach` proves the
# attaching dig-app holds the profile's slot-0x0010 identity key by VERIFYING an Ed25519 signature over
# the byte-identical `DIGNET-SESSION-v1 ‖ nonce ‖ profile_did` challenge (session.rs). Ed25519
# verification rides `ring` — ALREADY in the locked graph (the rustls/tokio-rustls transport uses it),
# so it adds no new crate. VERIFY-ONLY: the engine never holds a signing key. (dig-app signs with
# ed25519-dalek; ring verifies RFC-8032 signatures + is strict against malleable/small-order inputs.)
ring = "0.17"
tracing = "0.1"
# Best-effort CONCURRENT fan-out of the multi-source provider union (`UnionLocator`, #1443): query
# dig-dht + PEX + relay-introducer sources at once via `future::join_all` (order-preserving, so the
# dedup keeps DHT-first precedence). rustls/tokio already pull futures transitively; declaring it here
# makes it a first-class prod dep of the union seam. Minimal feature set (no executor).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
tempfile = "3"
# Same git rev as the normal dependency above, with dig-gossip's `test-util` feature added. That
# feature gates `__connect_stub_peer_with_direction`, which registers a connected peer without real
# TLS — the only way to assert what a broadcast ACTUALLY put on the wire from a test. Declared here
# rather than on the normal dependency so the shipped binary never carries the test hook: cargo
# unifies the feature into test builds only, since dev-dependencies are not built for `cargo build`.
dig-gossip = { git = "https://github.com/DIG-Network/dig-gossip", rev = "51054a4132ee51b7cee2cba1768b75ade5360f9c", default-features = false, features = ["rustls", "relay", "test-util"] }
# Generates the P-256 leaf key pairs the opcode-222 holdings tests sign with: `public_key_der()` IS the
# leaf `SubjectPublicKeyInfo` DER the wire carries as `provider_spki`, and whose SHA-256 is the
# announcing peer_id — so a test signer is a real §5.2 identity rather than a stand-in that could hide
# an attribution bug (#1429).
rcgen = "0.13"
# dig-download's in-memory harness (`MockRangeTransport`, `MockContent`, …), which the download-path
# tests drive the real orchestrator over.
#
# It is a DEV dependency and MUST STAY ONE (#1576). The `testkit` feature is also what makes
# `AcceptAnyModuleAnchor` — a fail-OPEN module anchor verifier — nameable at all; the crate compiles it
# out of a default consumer build precisely so a production wiring cannot reach it. The reshare path's
# anchor gate is its ONLY root of trust, so enabling this feature on the PRODUCTION `dig-download` entry
# above would put a bypass of that root of trust one `use` away. Dev-dependency features do not
# propagate to a consumer's build, so the node binaries never see it.
#
# Pinned by the `the_fail_open_anchor_verifier_is_not_reachable_from_a_production_build` test, which
# fails if `testkit` ever appears on the production entry.
dig-download = { version = "0.17", features = ["testkit"] }
# Captures the peer-facing serve's real emitted tracing records into an in-memory buffer, so the
# serve-observability tests (#1595) assert what an operator would actually see in the node log —
# and that no payload byte or proof ever reaches it.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# Builds canonical `did:chia:` strings for the on-chain DID-resolver tests (matches dig-identity's codec).
chia-sdk-utils = "0.30"
# The session attach tests sign challenges with the BLS12-381 G2 AugScheme (the app's slot-0x0010
# identity key), matching dig-ipc-protocol's signing contract and dig-identity's published G1 key.
chia-bls = "0.26"
# axum is a TEST-ONLY dependency of the engine library: the node no longer serves its
# own HTTP (the `dig-node-service` shell owns the axum transport, `dig-runtime` owns the
# in-process FFI path — dispatch is `handle_rpc`, which is transport-agnostic). The
# integration/unit tests still spawn small in-process axum mock servers (the §21 remote
# + a module server) to exercise the fetch/cache path hermetically.
axum = "0.7"
# In-process loopback mTLS peer drives the peer-network tests with NO real network (the CA-signed
# `dig_tls::NodeCert` minted by `load_or_generate_node_cert` is the test client's mTLS identity).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time", "test-util"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# The peer_network.rs integration test implements PeerRpcResponder (an async trait).
async-trait = "0.1"
